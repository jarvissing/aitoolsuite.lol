<style>
.tool-container { font-family: system-ui, -apple-system, sans-serif; background: #111827; padding: 24px; border-radius: 12px; box-sizing: border-box; max-width: 860px; margin: 0 auto; color: #f8fafc; }
.controls-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 14px; margin-bottom: 20px; }
@media (max-width: 600px) { .controls-grid { grid-template-columns: 1fr; } }
.field label { display: block; font-size: 13px; font-weight: 600; color: #94a3b8; margin-bottom: 6px; }
.field input { width: 100%; background: #0b0f19; color: #f8fafc; border: 1px solid #334155; border-radius: 8px; padding: 10px; box-sizing: border-box; font-family: monospace; font-size: 14px; }
.grid-preview { background: #0b0f19; border: 1px solid #334155; border-radius: 10px; padding: 16px; min-height: 200px; display: grid; gap: 12px; margin-bottom: 16px; }
.grid-item { background: #1e293b; border: 1px solid #3b82f6; border-radius: 6px; padding: 16px; text-align: center; font-family: monospace; font-weight: 700; color: #38bdf8; font-size: 14px; display: flex; align-items: center; justify-content: center; }
.output-box { width: 100%; height: 110px; background: #0b0f19; color: #38bdf8; border: 1px solid #334155; border-radius: 8px; padding: 12px; box-sizing: border-box; font-family: monospace; font-size: 13px; resize: vertical; margin-bottom: 10px; }
.btn-copy { background: #3b82f6; color: #fff; border: none; padding: 10px 18px; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 600; }
</style>
<div class="tool-container">
    <div class="controls-grid">
        <div class="field">
            <label>Columns (e.g. 3):</label>
            <input type="number" id="gridCols" value="3" min="1" max="12" oninput="updateGrid()">
        </div>
        <div class="field">
            <label>Rows (e.g. 2):</label>
            <input type="number" id="gridRows" value="2" min="1" max="12" oninput="updateGrid()">
        </div>
        <div class="field">
            <label>Gap (px):</label>
            <input type="number" id="gridGap" value="16" min="0" max="64" oninput="updateGrid()">
        </div>
    </div>
    <div id="gridCanvas" class="grid-preview"></div>
    <label style="display:block; font-size:13px; font-weight:600; color:#94a3b8; margin-bottom:6px;">Generated CSS Code:</label>
    <textarea id="cssGridOut" class="output-box" readonly></textarea>
    <button class="btn-copy" onclick="copyGridCss(this)">Copy CSS Code</button>
</div>
<script>
function updateGrid() {
    let cols = parseInt(document.getElementById('gridCols').value) || 3;
    let rows = parseInt(document.getElementById('gridRows').value) || 2;
    let gap = parseInt(document.getElementById('gridGap').value) || 16;
    
    let canvas = document.getElementById('gridCanvas');
    canvas.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
    canvas.style.gridTemplateRows = `repeat(${rows}, 1fr)`;
    canvas.style.gap = `${gap}px`;
    
    canvas.innerHTML = '';
    let total = cols * rows;
    for (let i = 1; i <= total; i++) {
        let div = document.createElement('div');
        div.className = 'grid-item';
        div.textContent = `Item ${i}`;
        canvas.appendChild(div);
    }
    
    let css = `.grid-container {\n  display: grid;\n  grid-template-columns: repeat(${cols}, 1fr);\n  grid-template-rows: repeat(${rows}, 1fr);\n  gap: ${gap}px;\n}`;
    document.getElementById('cssGridOut').value = css;
}
function copyGridCss(btn) {
    let t = document.getElementById('cssGridOut').value;
    if (!t) return;
    navigator.clipboard.writeText(t).then(() => {
        let orig = btn.textContent;
        btn.textContent = 'Copied!';
        setTimeout(() => btn.textContent = orig, 1800);
    });
}
updateGrid();
</script>
