<style>
.tool-container { font-family: system-ui, -apple-system, sans-serif; background: #111827; padding: 24px; border-radius: 12px; box-sizing: border-box; max-width: 860px; margin: 0 auto; color: #f8fafc; }
.color-preview-wrap { display: flex; align-items: center; gap: 20px; margin-bottom: 24px; }
.color-box { width: 90px; height: 90px; border-radius: 12px; border: 2px solid #334155; box-shadow: 0 4px 14px rgba(0,0,0,0.4); flex-shrink: 0; }
.color-inputs { flex-grow: 1; }
.input-row { margin-bottom: 14px; }
.input-row label { display: block; font-size: 13px; font-weight: 600; color: #94a3b8; margin-bottom: 5px; }
.input-field { width: 100%; background: #0b0f19; color: #f8fafc; border: 1px solid #334155; border-radius: 8px; padding: 10px 14px; font-family: monospace; font-size: 14px; box-sizing: border-box; }
.results-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px; margin-top: 20px; }
.result-card { background: #0b0f19; border: 1px solid #1e293b; border-radius: 8px; padding: 14px; }
.result-card .label { font-size: 12px; color: #94a3b8; font-weight: 600; margin-bottom: 6px; }
.result-card .value { font-family: monospace; font-size: 14px; color: #38bdf8; word-break: break-all; margin-bottom: 8px; }
.btn-copy-small { background: #1e293b; color: #e2e8f0; border: 1px solid #334155; padding: 5px 10px; border-radius: 4px; font-size: 11px; cursor: pointer; font-weight: 600; }
.btn-copy-small:hover { background: #334155; }
</style>
<div class="tool-container">
    <div class="color-preview-wrap">
        <div id="colorSquare" class="color-box" style="background-color: #3b82f6;"></div>
        <div class="color-inputs">
            <div class="input-row">
                <label>Enter Hex Color (e.g. #3b82f6 or 3b82f6):</label>
                <div style="display:flex; gap:10px;">
                    <input type="color" id="nativePicker" value="#3b82f6" style="width:48px; height:42px; padding:2px; background:#0b0f19; border:1px solid #334155; border-radius:6px; cursor:pointer;" oninput="onPickerChange()">
                    <input type="text" id="hexInput" class="input-field" value="#3b82f6" oninput="onHexChange()" placeholder="#3b82f6">
                </div>
            </div>
        </div>
    </div>

    <div class="results-grid">
        <div class="result-card">
            <div class="label">HEX:</div>
            <div id="resHex" class="value">#3b82f6</div>
            <button class="btn-copy-small" onclick="copyValue('resHex', this)">Copy HEX</button>
        </div>
        <div class="result-card">
            <div class="label">RGB:</div>
            <div id="resRgb" class="value">rgb(59, 130, 246)</div>
            <button class="btn-copy-small" onclick="copyValue('resRgb', this)">Copy RGB</button>
        </div>
        <div class="result-card">
            <div class="label">RGBA (100%):</div>
            <div id="resRgba" class="value">rgba(59, 130, 246, 1)</div>
            <button class="btn-copy-small" onclick="copyValue('resRgba', this)">Copy RGBA</button>
        </div>
        <div class="result-card">
            <div class="label">HSL:</div>
            <div id="resHsl" class="value">hsl(217, 91%, 60%)</div>
            <button class="btn-copy-small" onclick="copyValue('resHsl', this)">Copy HSL</button>
        </div>
    </div>
</div>
<script>
function hexToRgb(hex) {
    let clean = hex.replace('#', '').trim();
    if (clean.length === 3) {
        clean = clean.split('').map(c => c + c).join('');
    }
    if (clean.length !== 6) return null;
    let r = parseInt(clean.substring(0, 2), 16);
    let g = parseInt(clean.substring(2, 4), 16);
    let b = parseInt(clean.substring(4, 6), 16);
    if (isNaN(r) || isNaN(g) || isNaN(b)) return null;
    return { r, g, b };
}

function rgbToHsl(r, g, b) {
    r /= 255; g /= 255; b /= 255;
    let max = Math.max(r, g, b), min = Math.min(r, g, b);
    let h, s, l = (max + min) / 2;
    if (max === min) {
        h = s = 0;
    } else {
        let d = max - min;
        s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
        switch (max) {
            case r: h = (g - b) / d + (g < b ? 6 : 0); break;
            case g: h = (b - r) / d + 2; break;
            case b: h = (r - g) / d + 4; break;
        }
        h /= 6;
    }
    return {
        h: Math.round(h * 360),
        s: Math.round(s * 100),
        l: Math.round(l * 100)
    };
}

function updateColorOutputs(hex) {
    let rgb = hexToRgb(hex);
    if (!rgb) return;
    let hexNormalized = '#' + hex.replace('#', '').toLowerCase();
    let hsl = rgbToHsl(rgb.r, rgb.g, rgb.b);
    
    document.getElementById('colorSquare').style.backgroundColor = hexNormalized;
    document.getElementById('resHex').textContent = hexNormalized;
    document.getElementById('resRgb').textContent = `rgb(${rgb.r}, ${rgb.g}, ${rgb.b})`;
    document.getElementById('resRgba').textContent = `rgba(${rgb.r}, ${rgb.g}, ${rgb.b}, 1)`;
    document.getElementById('resHsl').textContent = `hsl(${hsl.h}, ${hsl.s}%, ${hsl.l}%)`;
}

function onHexChange() {
    let val = document.getElementById('hexInput').value.trim();
    if (val.length >= 4) {
        let rgb = hexToRgb(val);
        if (rgb) {
            let hexNorm = '#' + val.replace('#', '');
            if (hexNorm.length === 7) {
                document.getElementById('nativePicker').value = hexNorm;
            }
            updateColorOutputs(val);
        }
    }
}

function onPickerChange() {
    let val = document.getElementById('nativePicker').value;
    document.getElementById('hexInput').value = val;
    updateColorOutputs(val);
}

function copyValue(id, btn) {
    let text = document.getElementById(id).textContent;
    navigator.clipboard.writeText(text).then(() => {
        let orig = btn.textContent;
        btn.textContent = 'Copied!';
        setTimeout(() => btn.textContent = orig, 1500);
    });
}
updateColorOutputs('#3b82f6');
</script>
