<style>
.tool-container { font-family: system-ui, -apple-system, sans-serif; background: #111827; padding: 24px; border-radius: 12px; box-sizing: border-box; max-width: 860px; margin: 0 auto; color: #f8fafc; }
.pwd-display { background: #0b0f19; border: 1px solid #334155; border-radius: 8px; padding: 16px; font-family: monospace; font-size: 22px; color: #38bdf8; text-align: center; margin-bottom: 20px; font-weight: 700; word-break: break-all; }
.options-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin-bottom: 20px; font-size: 14px; }
.btn-row { display: flex; gap: 10px; }
.btn-gen { background: #3b82f6; color: #fff; border: none; padding: 12px 20px; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 14px; }
.btn-gen:hover { background: #2563eb; }
.btn-copy { background: #1e293b; color: #38bdf8; border: 1px solid #334155; padding: 12px 18px; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 14px; }
</style>
<div class="tool-container">
    <div id="pwdOutput" class="pwd-display">Click Generate</div>
    <div class="options-grid">
        <label><input type="range" id="pwdLen" min="8" max="64" value="20" oninput="document.getElementById('lenLbl').textContent = this.value; generatePassword()"> Length: <span id="lenLbl" style="font-weight:700;">20</span></label>
        <label><input type="checkbox" id="incUpper" checked onchange="generatePassword()"> Uppercase (A-Z)</label>
        <label><input type="checkbox" id="incLower" checked onchange="generatePassword()"> Lowercase (a-z)</label>
        <label><input type="checkbox" id="incNum" checked onchange="generatePassword()"> Numbers (0-9)</label>
        <label><input type="checkbox" id="incSym" checked onchange="generatePassword()"> Symbols (!@#$)</label>
    </div>
    <div class="btn-row">
        <button class="btn-gen" onclick="generatePassword()">⚡ Generate New Password</button>
        <button class="btn-copy" onclick="copyPassword(this)">Copy to Clipboard</button>
    </div>
</div>
<script>
function generatePassword() {
    let len = parseInt(document.getElementById('pwdLen').value);
    let chars = '';
    if (document.getElementById('incUpper').checked) chars += 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
    if (document.getElementById('incLower').checked) chars += 'abcdefghijklmnopqrstuvwxyz';
    if (document.getElementById('incNum').checked) chars += '0123456789';
    if (document.getElementById('incSym').checked) chars += '!@#$%^&*()_+-=[]{}|;:,.<>?';
    if (!chars) chars = 'abcdefghijklmnopqrstuvwxyz';
    let array = new Uint32Array(len);
    window.crypto.getRandomValues(array);
    let pwd = '';
    for (let i = 0; i < len; i++) {
        pwd += chars[array[i] % chars.length];
    }
    document.getElementById('pwdOutput').textContent = pwd;
}
function copyPassword(btn) {
    let p = document.getElementById('pwdOutput').textContent;
    if (!p || p === 'Click Generate') return;
    navigator.clipboard.writeText(p).then(() => {
        let orig = btn.textContent;
        btn.textContent = 'Copied!';
        setTimeout(() => btn.textContent = orig, 1800);
    });
}
generatePassword();
</script>
