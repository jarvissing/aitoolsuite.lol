<style>
.tool-container { font-family: system-ui, -apple-system, sans-serif; background: #121217; padding: 24px; border-radius: 12px; box-sizing: border-box; max-width: 840px; margin: 0 auto; color: #f1f5f9; border: 1px solid rgba(255, 255, 255, 0.08); }
.tool-container h3 { font-size: 15px; margin-top: 0; margin-bottom: 8px; color: #e2e8f0; }
.tool-container textarea { width: 100%; background: #1a1a24; border: 1px solid rgba(255, 255, 255, 0.12); border-radius: 8px; padding: 12px; box-sizing: border-box; font-family: 'JetBrains Mono', monospace; font-size: 13px; color: #f8fafc; margin-bottom: 12px; min-height: 120px; resize: vertical; }
.tool-container .btn-group { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
.tool-container button { background: #4f46e5; color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 500; }
.tool-container button:hover { background: #4338ca; }
.tool-container .btn-secondary { background: #272732; color: #cbd5e1; border: 1px solid rgba(255, 255, 255, 0.08); }
.tool-container .btn-secondary:hover { background: #323242; color: #fff; }
.tool-container .copy-btn { background: #10b981; }
.tool-container .copy-btn:hover { background: #059669; }
.tool-container .notice { font-size: 12px; color: #94a3b8; margin-top: 6px; }
</style>
<div class="tool-container">
    <h3>Input String / Data</h3>
    <textarea id="b64u-in" placeholder="Enter plain text to encode, or base64url string to decode..."></textarea>
    
    <div class="btn-group">
        <button onclick="encodeBase64Url()">Encode to Base64URL (RFC 4648)</button>
        <button onclick="decodeBase64Url()" class="btn-secondary">Decode Base64URL</button>
        <button onclick="copyB64Url(this)" class="copy-btn">Copy Output</button>
    </div>
    
    <h3>Base64URL Output</h3>
    <textarea id="b64u-out" placeholder="Result will appear here..." readonly></textarea>
    <div class="notice">RFC 4648 replaces '+' with '-' and '/' with '_', stripping '=' padding for safe URL query strings and JWT tokens.</div>
</div>
<script>
function encodeBase64Url() {
    const str = document.getElementById('b64u-in').value;
    const out = document.getElementById('b64u-out');
    if (!str) { out.value = ''; return; }
    try {
        const utf8Bytes = encodeURIComponent(str).replace(/%([0-9A-F]{2})/g, (m, p1) => String.fromCharCode('0x' + p1));
        const base64 = btoa(utf8Bytes);
        const base64url = base64.replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
        out.value = base64url;
    } catch(e) {
        out.value = 'Encoding error: ' + e.message;
    }
}

function decodeBase64Url() {
    let str = document.getElementById('b64u-in').value.trim();
    const out = document.getElementById('b64u-out');
    if (!str) { out.value = ''; return; }
    try {
        str = str.replace(/-/g, '+').replace(/_/g, '/');
        while (str.length % 4) {
            str += '=';
        }
        const binary = atob(str);
        const bytes = Array.from(binary, c => '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)).join('');
        out.value = decodeURIComponent(bytes);
    } catch(e) {
        out.value = 'Invalid Base64URL string: ' + e.message;
    }
}

function copyB64Url(btn) {
    const text = document.getElementById('b64u-out').value;
    if (!text) return;
    navigator.clipboard.writeText(text).then(() => {
        const orig = btn.textContent;
        btn.textContent = 'Copied!';
        setTimeout(() => btn.textContent = orig, 1500);
    });
}
</script>
