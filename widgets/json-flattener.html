<style>
.tool-container { font-family: system-ui, -apple-system, sans-serif; background: #121217; padding: 24px; border-radius: 12px; box-sizing: border-box; max-width: 840px; margin: 0 auto; color: #f1f5f9; border: 1px solid rgba(255, 255, 255, 0.08); }
.tool-container h3 { font-size: 15px; margin-top: 0; margin-bottom: 8px; color: #e2e8f0; }
.tool-container textarea { width: 100%; background: #1a1a24; border: 1px solid rgba(255, 255, 255, 0.12); border-radius: 8px; padding: 12px; box-sizing: border-box; font-family: 'JetBrains Mono', monospace; font-size: 13px; color: #f8fafc; margin-bottom: 12px; min-height: 130px; resize: vertical; }
.tool-container .btn-group { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
.tool-container button { background: #4f46e5; color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 500; }
.tool-container button:hover { background: #4338ca; }
.tool-container .btn-secondary { background: #272732; color: #cbd5e1; border: 1px solid rgba(255, 255, 255, 0.08); }
.tool-container .btn-secondary:hover { background: #323242; color: #fff; }
.tool-container .copy-btn { background: #10b981; }
.tool-container .copy-btn:hover { background: #059669; }
</style>
<div class="tool-container">
    <h3>Input JSON</h3>
    <textarea id="flat-in" placeholder='{"user": {"name": "Alex", "address": {"city": "Berlin", "zip": "10115"}}}'></textarea>
    
    <div class="btn-group">
        <button onclick="flattenJson()">Flatten to Dot-Notation</button>
        <button onclick="unflattenJson()" class="btn-secondary">Unflatten to Nested JSON</button>
        <button onclick="copyFlatOutput(this)" class="copy-btn">Copy Result</button>
    </div>
    
    <h3>Transformed JSON</h3>
    <textarea id="flat-out" placeholder="Output will appear here..." readonly></textarea>
</div>
<script>
function flattenObj(obj, prefix = '', res = {}) {
    for (let key in obj) {
        if (!obj.hasOwnProperty(key)) continue;
        const prop = prefix ? prefix + '.' + key : key;
        if (typeof obj[key] === 'object' && obj[key] !== null && !Array.isArray(obj[key])) {
            flattenObj(obj[key], prop, res);
        } else {
            res[prop] = obj[key];
        }
    }
    return res;
}

function unflattenObj(data) {
    const result = {};
    for (let i in data) {
        const keys = i.split('.');
        keys.reduce((acc, key, index) => {
            return acc[key] || (acc[key] = isNaN(Number(keys[index + 1])) ? (keys.length - 1 === index ? data[i] : {}) : []);
        }, result);
    }
    return result;
}

function flattenJson() {
    const raw = document.getElementById('flat-in').value.trim();
    const out = document.getElementById('flat-out');
    if (!raw) { out.value = ''; return; }
    try {
        const parsed = JSON.parse(raw);
        const flattened = flattenObj(parsed);
        out.value = JSON.stringify(flattened, null, 2);
    } catch(e) {
        out.value = 'JSON Parse Error: ' + e.message;
    }
}

function unflattenJson() {
    const raw = document.getElementById('flat-in').value.trim();
    const out = document.getElementById('flat-out');
    if (!raw) { out.value = ''; return; }
    try {
        const parsed = JSON.parse(raw);
        const unflattened = unflattenObj(parsed);
        out.value = JSON.stringify(unflattened, null, 2);
    } catch(e) {
        out.value = 'JSON Parse Error: ' + e.message;
    }
}

function copyFlatOutput(btn) {
    const text = document.getElementById('flat-out').value;
    if (!text) return;
    navigator.clipboard.writeText(text).then(() => {
        const orig = btn.textContent;
        btn.textContent = 'Copied!';
        setTimeout(() => btn.textContent = orig, 1500);
    });
}
</script>
