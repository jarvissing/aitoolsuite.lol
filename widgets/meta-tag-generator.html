<style>
.tool-container { font-family: system-ui, -apple-system, sans-serif; background: #111827; padding: 24px; border-radius: 12px; box-sizing: border-box; max-width: 900px; margin: 0 auto; color: #f8fafc; }
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 16px; }
@media (max-width: 640px) { .form-grid { grid-template-columns: 1fr; } }
.field label { display: block; font-size: 13px; font-weight: 600; color: #94a3b8; margin-bottom: 4px; }
.field input, .field textarea { width: 100%; background: #0b0f19; color: #f8fafc; border: 1px solid #334155; border-radius: 8px; padding: 10px; box-sizing: border-box; font-size: 13px; font-family: inherit; }
.output-code { background: #0b0f19; border: 1px solid #334155; border-radius: 8px; padding: 14px; color: #38bdf8; font-family: monospace; font-size: 12px; white-space: pre-wrap; word-break: break-all; margin-top: 10px; }
.btn-copy { background: #3b82f6; color: #fff; border: none; padding: 10px 18px; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 600; margin-top: 10px; }
</style>
<div class="tool-container">
    <div class="form-grid">
        <div class="field">
            <label>Page Title:</label>
            <input type="text" id="metaTitle" value="My Awesome Developer Tool" oninput="generateMetaTags()">
        </div>
        <div class="field">
            <label>Site Name:</label>
            <input type="text" id="metaSite" value="AI Tool Suite" oninput="generateMetaTags()">
        </div>
        <div class="field" style="grid-column: span 2;">
            <label>Meta Description (Max 160 chars):</label>
            <input type="text" id="metaDesc" value="Fast, free, and private developer utilities running 100% in your browser." oninput="generateMetaTags()">
        </div>
        <div class="field">
            <label>Canonical Page URL:</label>
            <input type="text" id="metaUrl" value="https://aitoolsuite.lol/tool.html" oninput="generateMetaTags()">
        </div>
        <div class="field">
            <label>Social Image (OG:Image URL):</label>
            <input type="text" id="metaImg" value="https://aitoolsuite.lol/og-image.png" oninput="generateMetaTags()">
        </div>
    </div>
    <label style="display:block; font-size:13px; font-weight:600; color:#94a3b8;">Generated HTML Meta Tags:</label>
    <div id="metaOutput" class="output-code"></div>
    <button class="btn-copy" onclick="copyMeta(this)">Copy All Meta Tags</button>
</div>
<script>
function generateMetaTags() {
    let t = document.getElementById('metaTitle').value;
    let s = document.getElementById('metaSite').value;
    let d = document.getElementById('metaDesc').value;
    let u = document.getElementById('metaUrl').value;
    let i = document.getElementById('metaImg').value;
    let code = `<!-- Primary Meta Tags -->\n<title>${t}</title>\n<meta name="title" content="${t}">\n<meta name="description" content="${d}">\n<link rel="canonical" href="${u}">\n\n<!-- Open Graph / Facebook -->\n<meta property="og:type" content="website">\n<meta property="og:url" content="${u}">\n<meta property="og:title" content="${t}">\n<meta property="og:description" content="${d}">\n<meta property="og:image" content="${i}">\n<meta property="og:site_name" content="${s}">\n\n<!-- Twitter Card -->\n<meta property="twitter:card" content="summary_large_image">\n<meta property="twitter:url" content="${u}">\n<meta property="twitter:title" content="${t}">\n<meta property="twitter:description" content="${d}">\n<meta property="twitter:image" content="${i}">`;
    document.getElementById('metaOutput').textContent = code;
}
function copyMeta(btn) {
    let code = document.getElementById('metaOutput').textContent;
    navigator.clipboard.writeText(code).then(() => {
        let orig = btn.textContent;
        btn.textContent = 'Copied!';
        setTimeout(() => btn.textContent = orig, 1800);
    });
}
generateMetaTags();
</script>
