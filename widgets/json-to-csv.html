<style>
.tool-container { font-family: system-ui, -apple-system, sans-serif; background: #111827; padding: 24px; border-radius: 12px; box-sizing: border-box; max-width: 900px; margin: 0 auto; color: #f8fafc; }
.tool-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px; }
@media (max-width: 640px) { .tool-grid { grid-template-columns: 1fr; } }
.col label { display: block; font-size: 13px; font-weight: 600; color: #94a3b8; margin-bottom: 6px; }
.col textarea { width: 100%; height: 220px; background: #0b0f19; color: #f8fafc; border: 1px solid #334155; border-radius: 8px; padding: 12px; box-sizing: border-box; font-family: monospace; font-size: 13px; resize: vertical; }
.btn-row { display: flex; gap: 10px; }
.btn-act { background: #3b82f6; color: #fff; border: none; padding: 10px 18px; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 13px; }
.btn-copy { background: #1e293b; color: #38bdf8; border: 1px solid #334155; padding: 10px 16px; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 600; }
</style>
<div class="tool-container">
    <div class="tool-grid">
        <div class="col">
            <label>JSON Array Input:</label>
            <textarea id="jsonInputCsv" placeholder="[&#10;  {&quot;id&quot;: 1, &quot;name&quot;: &quot;Alice&quot;, &quot;role&quot;: &quot;Developer&quot;},&#10;  {&quot;id&quot;: 2, &quot;name&quot;: &quot;Bob&quot;, &quot;role&quot;: &quot;Designer&quot;}&#10;]" oninput="convertJsonToCsv()"></textarea>
        </div>
        <div class="col">
            <label>CSV Output:</label>
            <textarea id="csvOutputJson" readonly placeholder="CSV output will appear here..."></textarea>
        </div>
    </div>
    <div class="btn-row">
        <button class="btn-act" onclick="convertJsonToCsv()">Convert to CSV</button>
        <button class="btn-copy" onclick="copyJsonCsv(this)">Copy CSV</button>
    </div>
</div>
<script>
function convertJsonToCsv() {
    let raw = document.getElementById('jsonInputCsv').value.trim();
    if (!raw) {
        document.getElementById('csvOutputJson').value = '';
        return;
    }
    try {
        let arr = JSON.parse(raw);
        if (!Array.isArray(arr) || arr.length === 0) {
            document.getElementById('csvOutputJson').value = 'Error: Expected an array of objects.';
            return;
        }
        let headers = Array.from(new Set(arr.flatMap(obj => Object.keys(obj))));
        let rows = [headers.join(',')];
        for (let obj of arr) {
            let row = headers.map(h => {
                let val = obj[h] !== undefined ? obj[h] : '';
                val = String(val).replace(/"/g, '""');
                return (val.includes(',') || val.includes('\n')) ? `"${val}"` : val;
            });
            rows.push(row.join(','));
        }
        document.getElementById('csvOutputJson').value = rows.join('\n');
    } catch(e) {
        document.getElementById('csvOutputJson').value = 'Invalid JSON: ' + e.message;
    }
}
function copyJsonCsv(btn) {
    let text = document.getElementById('csvOutputJson').value;
    if (!text) return;
    navigator.clipboard.writeText(text).then(() => {
        let orig = btn.textContent;
        btn.textContent = 'Copied!';
        setTimeout(() => btn.textContent = orig, 1800);
    });
}
</script>
