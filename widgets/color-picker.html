<style>
.tool-container { font-family: system-ui, -apple-system, sans-serif; background: #f8f9fa; padding: 20px; border-radius: 8px; box-sizing: border-box; max-width: 800px; margin: 0 auto; color: #333; }
.tool-container .color-row { display: flex; align-items: center; gap: 20px; margin-bottom: 20px; flex-wrap: wrap; }
.tool-container input[type="color"] { width: 100px; height: 100px; padding: 0; border: none; border-radius: 8px; cursor: pointer; background: none; }
.tool-container input[type="text"] { flex-grow: 1; background: #fff; border: 1px solid #ddd; border-radius: 8px; padding: 10px; box-sizing: border-box; font-family: monospace; font-size: 16px; min-width: 150px; }
.tool-container .swatch-preview { width: 100%; height: 50px; border-radius: 8px; border: 1px solid #ddd; margin-bottom: 20px; }
.tool-container .val-row { display: flex; justify-content: space-between; align-items: center; background: #fff; padding: 10px; border: 1px solid #ddd; border-radius: 8px; margin-bottom: 10px; }
.tool-container .val-text { font-family: monospace; font-size: 16px; }
.tool-container button { background: #4361ee; color: white; border: none; padding: 8px 12px; border-radius: 6px; cursor: pointer; font-size: 12px; transition: background 0.2s; margin: 0; }
.tool-container button:hover { background: #324ccc; }
</style>
<div class="tool-container">
    <div class="color-row">
        <input type="color" id="color-picker" value="#4361ee" oninput="updateFromPicker()">
        <input type="text" id="color-input" value="#4361ee" placeholder="Paste hex e.g. #4361ee" oninput="updateFromInput()">
    </div>
    <div id="color-preview" class="swatch-preview" style="background-color: #4361ee;"></div>
    
    <div class="val-row">
        <span class="val-text" id="val-hex">#4361ee</span>
        <button onclick="copyColor(this, 'val-hex')">Copy HEX</button>
    </div>
    <div class="val-row">
        <span class="val-text" id="val-rgb">rgb(67, 97, 238)</span>
        <button onclick="copyColor(this, 'val-rgb')">Copy RGB</button>
    </div>
    <div class="val-row">
        <span class="val-text" id="val-hsl">hsl(229, 82%, 60%)</span>
        <button onclick="copyColor(this, 'val-hsl')">Copy HSL</button>
    </div>
</div>
<script>
function hexToRgb(hex) {
    let r = 0, g = 0, b = 0;
    if (hex.length === 4) { r = parseInt(hex[1]+hex[1],16); g = parseInt(hex[2]+hex[2],16); b = parseInt(hex[3]+hex[3],16); }
    else if (hex.length === 7) { r = parseInt(hex.substring(1,3),16); g = parseInt(hex.substring(3,5),16); b = parseInt(hex.substring(5,7),16); }
    return {r, g, b};
}
function rgbToHsl(r, g, b) {
    r /= 255; g /= 255; b /= 255;
    let max = Math.max(r, g, b), min = Math.min(r, g, b);
    let h, s, l = (max + min) / 2;
    if(max === min) { h = s = 0; }
    else {
        let d = max - min;
        s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
        switch(max) {
            case r: h = (g - b) / d + (g < b ? 6 : 0); break;
            case g: h = (b - r) / d + 2; break;
            case b: h = (r - g) / d + 4; break;
        }
        h /= 6;
    }
    return { h: Math.round(h * 360), s: Math.round(s * 100), l: Math.round(l * 100) };
}
function updateUI(hex) {
    const rgb = hexToRgb(hex);
    const hsl = rgbToHsl(rgb.r, rgb.g, rgb.b);
    
    document.getElementById('color-picker').value = hex;
    document.getElementById('color-input').value = hex;
    document.getElementById('color-preview').style.backgroundColor = hex;
    
    document.getElementById('val-hex').textContent = hex;
    document.getElementById('val-rgb').textContent = \`rgb(\${rgb.r}, \${rgb.g}, \${rgb.b})\`;
    document.getElementById('val-hsl').textContent = \`hsl(\${hsl.h}, \${hsl.s}%, \${hsl.l}%)\`;
}
function updateFromPicker() {
    updateUI(document.getElementById('color-picker').value);
}
function updateFromInput() {
    let val = document.getElementById('color-input').value.trim();
    if (val.startsWith('#') && (val.length === 4 || val.length === 7)) {
        // basic valid check
        updateUI(val);
    }
}
function copyColor(btn, id) {
    const text = document.getElementById(id).textContent;
    navigator.clipboard.writeText(text).then(() => {
        const orig = btn.textContent;
        btn.textContent = 'Copied!';
        setTimeout(() => btn.textContent = orig, 2000);
    });
}
</script>
