<style>
.jsx-container {
    max-width: 800px;
    margin: 0 auto;
    font-family: 'Inter', system-ui, sans-serif;
    color: #e2e8f0;
}
.jsx-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
    margin-top: 12px;
}
@media (max-width: 640px) {
    .jsx-grid { grid-template-columns: 1fr; }
}
.jsx-textarea {
    width: 100%;
    height: 250px;
    background: #09090b;
    border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: 12px;
    padding: 14px;
    color: #f8fafc;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.85rem;
    resize: none;
    box-sizing: border-box;
    line-height: 1.5;
}
.jsx-textarea:focus { outline: none; border-color: #3b82f6; }
.jsx-toolbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
}
.jsx-btn {
    background: #3b82f6;
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 8px 16px;
    font-size: 0.85rem;
    font-weight: 600;
    cursor: pointer;
}
.jsx-btn:hover { background: #2563eb; }
.jsx-copy-btn {
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid rgba(255, 255, 255, 0.12);
    color: #cbd5e1;
    border-radius: 8px;
    padding: 8px 14px;
    font-size: 0.8rem;
    font-weight: 600;
    cursor: pointer;
}
.jsx-copy-btn:hover { background: rgba(59, 130, 246, 0.2); color: #93c5fd; }
</style>

<div class="jsx-container">
    <div class="jsx-toolbar">
        <button class="jsx-btn" onclick="convertToJSX()">Convert to JSX</button>
        <button class="jsx-copy-btn" onclick="copyJSX(this)">Copy JSX</button>
    </div>

    <div class="jsx-grid">
        <div>
            <div style="font-size: 0.82rem; font-weight: 600; color: #94a3b8; margin-bottom: 6px;">HTML Input</div>
            <textarea id="htmlSource" class="jsx-textarea" placeholder="Paste HTML snippet here..." oninput="convertToJSX()"><div class="alert alert-primary" for="user-input" tabindex="0">
    <h4 style="color: blue; margin-top: 10px;">Welcome</h4>
    <input type="text" readonly disabled>
    <img src="avatar.png" alt="Avatar">
    <br>
</div></textarea>
        </div>

        <div>
            <div style="font-size: 0.82rem; font-weight: 600; color: #94a3b8; margin-bottom: 6px;">React JSX Output</div>
            <textarea id="jsxTarget" class="jsx-textarea" readonly style="color: #38bdf8;"></textarea>
        </div>
    </div>
</div>

<script>
function convertToJSX() {
    let html = document.getElementById('htmlSource').value;
    if (!html.trim()) {
        document.getElementById('jsxTarget').value = '';
        return;
    }

    // 1. Replace class= with className=
    let jsx = html.replace(/\bclass=(["'][^"']*["'])/g, 'className=$1');

    // 2. Replace for= with htmlFor=
    jsx = jsx.replace(/\bfor=(["'][^"']*["'])/g, 'htmlFor=$1');

    // 3. Replace tabindex with tabIndex
    jsx = jsx.replace(/\btabindex=(["'][^"']*["'])/g, 'tabIndex=$1');

    // 4. Convert self-closing void elements (<input>, <img>, <br>, <hr>, <meta>, <link>)
    jsx = jsx.replace(/<(area|base|br|col|embed|hr|img|input|link|meta|param|source|track|wbr)([^>]*?)(\/?>)/gi, (match, tag, attrs, closing) => {
        const cleanAttrs = attrs.trim();
        return `<${tag} ${cleanAttrs} />`.replace(/\s+>$/, ' />');
    });

    // 5. Convert inline styles: style="color: red; margin-top: 10px" -> style={{ color: 'red', marginTop: '10px' }}
    jsx = jsx.replace(/style=(["'])(.*?)\1/gi, (match, quote, styleStr) => {
        const rules = styleStr.split(';').map(r => r.trim()).filter(Boolean);
        const objRules = rules.map(rule => {
            const [prop, ...valParts] = rule.split(':');
            if (!prop || !valParts.length) return '';
            const camelProp = prop.trim().replace(/-([a-z])/g, (g) => g[1].toUpperCase());
            const val = valParts.join(':').trim();
            return `${camelProp}: '${val}'`;
        }).filter(Boolean);
        return `style={{ ${objRules.join(', ')} }}`;
    });

    document.getElementById('jsxTarget').value = jsx;
}

function copyJSX(btn) {
    const text = document.getElementById('jsxTarget').value;
    if (!text) return;
    navigator.clipboard.writeText(text).then(() => {
        const orig = btn.textContent;
        btn.textContent = 'Copied!';
        setTimeout(() => btn.textContent = orig, 1500);
    });
}

document.addEventListener('DOMContentLoaded', convertToJSX);
</script>
