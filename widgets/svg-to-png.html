<style>
.tool-container { font-family: system-ui, -apple-system, sans-serif; background: #111827; padding: 24px; border-radius: 12px; box-sizing: border-box; max-width: 860px; margin: 0 auto; color: #f8fafc; }
.tool-grid { display: grid; grid-template-columns: 1fr; gap: 16px; margin-bottom: 20px; }
.field label { display: block; font-size: 13px; font-weight: 600; color: #94a3b8; margin-bottom: 6px; }
.field textarea { width: 100%; height: 160px; background: #0b0f19; color: #f8fafc; border: 1px solid #334155; border-radius: 8px; padding: 12px; box-sizing: border-box; font-family: monospace; font-size: 13px; resize: vertical; }
.scale-row { display: flex; gap: 10px; align-items: center; margin-bottom: 16px; }
.scale-row label { font-size: 13px; font-weight: 600; color: #94a3b8; }
.scale-row select { background: #0b0f19; color: #fff; border: 1px solid #334155; border-radius: 6px; padding: 8px 12px; font-size: 13px; }
.btn-act { background: #3b82f6; color: #fff; border: none; padding: 12px 24px; border-radius: 8px; cursor: pointer; font-weight: 700; font-size: 14px; }
.btn-act:hover { background: #2563eb; }
.preview-box { background: #0b0f19; border: 1px solid #334155; border-radius: 8px; padding: 20px; text-align: center; min-height: 120px; display: flex; align-items: center; justify-content: center; margin-bottom: 16px; }
</style>
<div class="tool-container">
    <div class="tool-grid">
        <div class="field">
            <label>Paste SVG Code:</label>
            <textarea id="svgInput" placeholder="<svg xmlns=&quot;http://www.w3.org/2000/svg&quot; width=&quot;100&quot; height=&quot;100&quot; viewBox=&quot;0 0 100 100&quot;><circle cx=&quot;50&quot; cy=&quot;50&quot; r=&quot;40&quot; fill=&quot;#3b82f6&quot;/></svg>" oninput="renderSvgPreview()"></textarea>
        </div>
    </div>
    <div class="scale-row">
        <label>Export Resolution Scale:</label>
        <select id="scaleFactor">
            <option value="1">1x (Original SVG Dimensions)</option>
            <option value="2" selected>2x High-DPI (Retina)</option>
            <option value="4">4x Ultra-HD (Print & Mockups)</option>
        </select>
    </div>
    <div id="svgPreview" class="preview-box">
        <span style="color:#64748b; font-size:13px;">SVG Preview will appear here...</span>
    </div>
    <button class="btn-act" onclick="exportToPng()">Export and Download PNG</button>
</div>
<script>
function renderSvgPreview() {
    let svg = document.getElementById('svgInput').value.trim();
    let box = document.getElementById('svgPreview');
    if (!svg) {
        box.innerHTML = '<span style="color:#64748b; font-size:13px;">SVG Preview will appear here...</span>';
        return;
    }
    box.innerHTML = svg;
}
function exportToPng() {
    let svg = document.getElementById('svgInput').value.trim();
    if (!svg) return;
    let scale = parseInt(document.getElementById('scaleFactor').value) || 2;
    let img = new Image();
    let blob = new Blob([svg], {type: 'image/svg+xml;charset=utf-8'});
    let url = URL.createObjectURL(blob);
    img.onload = function() {
        let canvas = document.createElement('canvas');
        canvas.width = (img.width || 400) * scale;
        canvas.height = (img.height || 400) * scale;
        let ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        let pngUrl = canvas.toDataURL('image/png');
        let a = document.createElement('a');
        a.href = pngUrl;
        a.download = 'converted-image.png';
        a.click();
        URL.revokeObjectURL(url);
    };
    img.src = url;
}
</script>
