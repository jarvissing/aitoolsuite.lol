<style>
.tool-container { font-family: system-ui, -apple-system, sans-serif; background: #111827; padding: 24px; border-radius: 12px; box-sizing: border-box; max-width: 900px; margin: 0 auto; color: #f8fafc; }
.tool-controls { display: flex; align-items: center; gap: 16px; margin-bottom: 20px; flex-wrap: wrap; }
.tool-controls input[type="color"] { width: 50px; height: 44px; border: none; border-radius: 8px; cursor: pointer; background: transparent; }
.palette-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(80px, 1fr)); gap: 8px; margin-bottom: 20px; }
.shade-box { border-radius: 8px; padding: 16px 8px; text-align: center; font-size: 11px; font-weight: 700; cursor: pointer; transition: transform 0.15s; border: 1px solid rgba(255,255,255,0.1); }
.shade-box:hover { transform: translateY(-3px); }
.code-box { background: #0b0f19; border: 1px solid #334155; border-radius: 8px; padding: 14px; color: #38bdf8; font-family: monospace; font-size: 12px; white-space: pre-wrap; }
</style>
<div class="tool-container">
    <div class="tool-controls">
        <label style="font-size:14px; font-weight:600;">Pick Base Color:</label>
        <input type="color" id="baseColor" value="#3b82f6" oninput="generateTailwindShades()">
        <span id="baseHex" style="font-family:monospace; font-weight:700; font-size:15px;">#3B82F6</span>
    </div>
    <div id="paletteContainer" class="palette-grid"></div>
    <label style="font-size:13px; font-weight:600; color:#94a3b8; margin-bottom:6px; display:block;">Tailwind CSS Config Snippet (Click to Copy):</label>
    <div id="tailwindConfig" class="code-box" onclick="copyConfig()"></div>
</div>
<script>
function hexToRgb(hex) {
    let r = parseInt(hex.slice(1,3), 16), g = parseInt(hex.slice(3,5), 16), b = parseInt(hex.slice(5,7), 16);
    return {r, g, b};
}
function rgbToHex(r, g, b) {
    return '#' + [r, g, b].map(x => Math.max(0, Math.min(255, Math.round(x))).toString(16).padStart(2, '0')).join('').toUpperCase();
}
function generateTailwindShades() {
    let hex = document.getElementById('baseColor').value;
    document.getElementById('baseHex').textContent = hex.toUpperCase();
    let rgb = hexToRgb(hex);
    let shades = [
        { name: '50', factor: 0.9 },
        { name: '100', factor: 0.75 },
        { name: '200', factor: 0.6 },
        { name: '300', factor: 0.4 },
        { name: '400', factor: 0.2 },
        { name: '500', factor: 0 },
        { name: '600', factor: -0.2 },
        { name: '700', factor: -0.4 },
        { name: '800', factor: -0.6 },
        { name: '900', factor: -0.8 },
        { name: '950', factor: -0.9 }
    ];
    let container = document.getElementById('paletteContainer');
    container.innerHTML = '';
    let configObj = {};
    shades.forEach(s => {
        let r = s.factor > 0 ? rgb.r + (255 - rgb.r) * s.factor : rgb.r * (1 + s.factor);
        let g = s.factor > 0 ? rgb.g + (255 - rgb.g) * s.factor : rgb.g * (1 + s.factor);
        let b = s.factor > 0 ? rgb.b + (255 - rgb.b) * s.factor : rgb.b * (1 + s.factor);
        let shadeHex = rgbToHex(r, g, b);
        configObj[s.name] = shadeHex;
        let box = document.createElement('div');
        box.className = 'shade-box';
        box.style.background = shadeHex;
        box.style.color = (s.factor > 0.3) ? '#0f172a' : '#ffffff';
        box.innerHTML = `<div>${s.name}</div><div style="font-size:10px; opacity:0.85; margin-top:4px;">${shadeHex}</div>`;
        box.onclick = () => navigator.clipboard.writeText(shadeHex);
        container.appendChild(box);
    });
    document.getElementById('tailwindConfig').textContent = `// tailwind.config.js\ncolors: {\n  brand: ` + JSON.stringify(configObj, null, 2).replace(/"/g, "'") + `\n}`;
}
function copyConfig() {
    let t = document.getElementById('tailwindConfig').textContent;
    navigator.clipboard.writeText(t).then(() => alert('Copied Tailwind Config snippet to clipboard!'));
}
generateTailwindShades();
</script>
