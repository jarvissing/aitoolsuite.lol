<style>
.tool-container { font-family: system-ui, -apple-system, sans-serif; background: #111827; padding: 24px; border-radius: 12px; box-sizing: border-box; max-width: 960px; margin: 0 auto; color: #f8fafc; }
.tool-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px; }
@media (max-width: 640px) { .tool-grid { grid-template-columns: 1fr; } }
.col label { display: block; font-size: 13px; font-weight: 600; color: #94a3b8; margin-bottom: 6px; }
.col textarea { width: 100%; height: 160px; background: #0b0f19; color: #f8fafc; border: 1px solid #334155; border-radius: 8px; padding: 12px; box-sizing: border-box; font-family: monospace; font-size: 13px; resize: vertical; }
.diff-result { background: #0b0f19; border: 1px solid #334155; border-radius: 8px; padding: 14px; font-family: monospace; font-size: 13px; min-height: 140px; overflow-x: auto; line-height: 1.6; }
.diff-add { background: rgba(34, 197, 94, 0.15); color: #4ade80; display: block; padding: 2px 6px; border-left: 3px solid #22c55e; }
.diff-rem { background: rgba(239, 68, 68, 0.15); color: #f87171; display: block; padding: 2px 6px; border-left: 3px solid #ef4444; }
.diff-same { color: #94a3b8; display: block; padding: 2px 6px; }
</style>
<div class="tool-container">
    <div class="tool-grid">
        <div class="col">
            <label>Original Text / Code:</label>
            <textarea id="origText" placeholder="Paste original text..." oninput="compareDiff()"></textarea>
        </div>
        <div class="col">
            <label>Modified Text / Code:</label>
            <textarea id="modText" placeholder="Paste modified text..." oninput="compareDiff()"></textarea>
        </div>
    </div>
    <label style="display:block; font-size:13px; font-weight:600; color:#94a3b8; margin-bottom:6px;">Visual Difference Comparison:</label>
    <div id="diffOutput" class="diff-result">// Difference will appear here...</div>
</div>
<script>
function compareDiff() {
    let t1 = document.getElementById('origText').value.split('\n');
    let t2 = document.getElementById('modText').value.split('\n');
    let out = document.getElementById('diffOutput');
    if (!document.getElementById('origText').value && !document.getElementById('modText').value) {
        out.textContent = '// Difference will appear here...';
        return;
    }
    out.innerHTML = '';
    let max = Math.max(t1.length, t2.length);
    for (let i = 0; i < max; i++) {
        let l1 = t1[i];
        let l2 = t2[i];
        if (l1 === l2) {
            let s = document.createElement('span');
            s.className = 'diff-same';
            s.textContent = '  ' + (l1 || '');
            out.appendChild(s);
        } else {
            if (l1 !== undefined) {
                let r = document.createElement('span');
                r.className = 'diff-rem';
                r.textContent = '- ' + l1;
                out.appendChild(r);
            }
            if (l2 !== undefined) {
                let a = document.createElement('span');
                a.className = 'diff-add';
                a.textContent = '+ ' + l2;
                out.appendChild(a);
            }
        }
    }
}
</script>
