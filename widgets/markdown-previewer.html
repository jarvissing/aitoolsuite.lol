<style>
.tool-container { font-family: system-ui, -apple-system, sans-serif; background: #111827; padding: 20px; border-radius: 12px; box-sizing: border-box; max-width: 800px; margin: 0 auto; color: #f8fafc; }
.tool-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px; }
@media (max-width: 650px) { .tool-grid { grid-template-columns: 1fr; } }
.tool-container textarea { width: 100%; background: #0b0f19; color: #f8fafc; border: 1px solid #334155; border-radius: 8px; padding: 12px; box-sizing: border-box; font-family: monospace; font-size: 14px; min-height: 220px; resize: vertical; }
.md-preview { background: #0b0f19; border: 1px solid #334155; border-radius: 8px; padding: 16px; min-height: 220px; color: #e2e8f0; font-size: 14px; overflow-y: auto; max-height: 400px; }
.md-preview h1, .md-preview h2, .md-preview h3 { color: #818cf8; margin-top: 10px; margin-bottom: 6px; }
.md-preview p { margin-bottom: 8px; line-height: 1.5; }
.md-preview code { background: #1e293b; padding: 2px 6px; border-radius: 4px; font-family: monospace; color: #f43f5e; }
.md-preview pre { background: #1e293b; padding: 10px; border-radius: 6px; overflow-x: auto; margin-bottom: 8px; }
.tool-container button { background: linear-gradient(135deg, #4f46e5 0%, #4361ee 100%); color: white; border: none; padding: 10px 18px; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: 600; margin-right: 8px; transition: transform 0.2s; }
.tool-container button:hover { transform: translateY(-1px); }
</style>
<div class="tool-container">
    <div class="tool-grid">
        <div>
            <div style="font-size: 12px; color: #94a3b8; margin-bottom: 6px; text-transform: uppercase; font-weight: 600;">Markdown Input</div>
            <textarea id="md-input" placeholder="# Heading 1&#10;&#10;Write **bold text**, *italic text*, or `code` here..." oninput="renderMarkdown()"></textarea>
        </div>
        <div>
            <div style="font-size: 12px; color: #94a3b8; margin-bottom: 6px; text-transform: uppercase; font-weight: 600;">Live HTML Preview</div>
            <div id="md-output" class="md-preview"></div>
        </div>
    </div>
    <div>
        <button onclick="copyHtml(this)">Copy HTML</button>
        <button onclick="clearText()">Clear</button>
    </div>
</div>
<script>
function renderMarkdown() {
    let raw = document.getElementById('md-input').value;
    let html = raw
        .replace(/^### (.*$)/gim, '<h3>$1</h3>')
        .replace(/^## (.*$)/gim, '<h2>$1</h2>')
        .replace(/^# (.*$)/gim, '<h1>$1</h1>')
        .replace(/\*\*(.*)\*\*/gim, '<strong>$1</strong>')
        .replace(/\*(.*)\*/gim, '<em>$1</em>')
        .replace(/`([^`]+)`/gim, '<code>$1</code>')
        .replace(/^\> (.*$)/gim, '<blockquote style="border-left: 3px solid #6366f1; padding-left: 10px; color: #94a3b8;">$1</blockquote>')
        .replace(/\n$/gim, '<br />')
        .replace(/\n\n/gim, '</p><p>');
    document.getElementById('md-output').innerHTML = '<p>' + html + '</p>';
}
function copyHtml(btn) {
    const html = document.getElementById('md-output').innerHTML;
    navigator.clipboard.writeText(html).then(() => {
        const orig = btn.textContent;
        btn.textContent = 'Copied!';
        setTimeout(() => btn.textContent = orig, 2000);
    });
}
function clearText() {
    document.getElementById('md-input').value = '';
    renderMarkdown();
}
renderMarkdown();
</script>
