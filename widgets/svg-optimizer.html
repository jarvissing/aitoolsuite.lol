<style>
.tool-container { font-family: system-ui, -apple-system, sans-serif; background: #111827; padding: 24px; border-radius: 12px; box-sizing: border-box; max-width: 860px; margin: 0 auto; color: #f8fafc; }
.tool-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px; }
@media (max-width: 640px) { .tool-grid { grid-template-columns: 1fr; } }
.col textarea { width: 100%; height: 160px; background: #0b0f19; color: #f8fafc; border: 1px solid #334155; border-radius: 8px; padding: 12px; box-sizing: border-box; font-family: monospace; font-size: 13px; resize: vertical; }
.preview-box { background: #0b0f19; border: 1px solid #334155; border-radius: 8px; padding: 20px; text-align: center; min-height: 120px; display: flex; align-items: center; justify-content: center; }
</style>
<div class="tool-container">
    <div class="tool-grid">
        <div class="col">
            <label style="display:block; font-size:13px; font-weight:600; color:#94a3b8; margin-bottom:6px;">Raw SVG Code:</label>
            <textarea id="rawSvg" placeholder="<svg ...>...</svg>" oninput="optimizeSvg()"></textarea>
        </div>
        <div class="col">
            <label style="display:block; font-size:13px; font-weight:600; color:#94a3b8; margin-bottom:6px;">Optimized Minified SVG:</label>
            <textarea id="optSvg" readonly placeholder="Minified SVG will appear here..."></textarea>
        </div>
    </div>
    <label style="display:block; font-size:13px; font-weight:600; color:#94a3b8; margin-bottom:6px;">Live Visual SVG Preview:</label>
    <div id="svgPreview" class="preview-box">// SVG preview will render here</div>
</div>
<script>
function optimizeSvg() {
    let raw = document.getElementById('rawSvg').value.trim();
    if (!raw) {
        document.getElementById('optSvg').value = '';
        document.getElementById('svgPreview').innerHTML = '// SVG preview will render here';
        return;
    }
    let min = raw.replace(/<!--[\s\S]*?-->/g, '').replace(/>\s+</g, '><').replace(/\s{2,}/g, ' ').trim();
    document.getElementById('optSvg').value = min;
    document.getElementById('svgPreview').innerHTML = min;
}
</script>
