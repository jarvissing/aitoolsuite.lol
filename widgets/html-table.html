<style>
.tool-container { font-family: system-ui, -apple-system, sans-serif; background: #111827; padding: 24px; border-radius: 12px; box-sizing: border-box; max-width: 900px; margin: 0 auto; color: #f8fafc; }
.controls-bar { display: flex; gap: 16px; flex-wrap: wrap; margin-bottom: 20px; align-items: center; background: #0b0f19; padding: 12px 16px; border-radius: 8px; border: 1px solid #1e293b; }
.ctrl-group { display: flex; align-items: center; gap: 8px; font-size: 13px; color: #94a3b8; }
.ctrl-group input[type="number"] { width: 60px; background: #1e293b; color: #fff; border: 1px solid #334155; border-radius: 4px; padding: 4px 8px; font-size: 13px; }
.ctrl-group label { cursor: pointer; color: #e2e8f0; }
.preview-wrap { margin-bottom: 20px; overflow-x: auto; background: #0b0f19; padding: 16px; border-radius: 8px; border: 1px solid #1e293b; }
#tablePreview table { width: 100%; border-collapse: collapse; font-size: 13px; }
#tablePreview th, #tablePreview td { padding: 8px 12px; border: 1px solid #334155; text-align: left; }
#tablePreview th { background: #1e293b; color: #38bdf8; font-weight: 600; }
.code-box { width: 100%; height: 160px; background: #0b0f19; color: #38bdf8; border: 1px solid #334155; border-radius: 8px; padding: 12px; box-sizing: border-box; font-family: monospace; font-size: 13px; resize: vertical; margin-bottom: 12px; }
.btn-copy { background: #3b82f6; color: #fff; border: none; padding: 10px 18px; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 600; }
</style>
<div class="tool-container">
    <div class="controls-bar">
        <div class="ctrl-group">
            <span>Rows:</span>
            <input type="number" id="tblRows" min="1" max="15" value="3" onchange="renderTable()">
        </div>
        <div class="ctrl-group">
            <span>Columns:</span>
            <input type="number" id="tblCols" min="1" max="10" value="3" onchange="renderTable()">
        </div>
        <div class="ctrl-group">
            <label><input type="checkbox" id="tblHeader" checked onchange="renderTable()"> Include &lt;th&gt; Header</label>
        </div>
        <div class="ctrl-group">
            <label><input type="checkbox" id="tblStriped" checked onchange="renderTable()"> Striped Rows</label>
        </div>
    </div>

    <label style="display:block; font-size:13px; font-weight:600; color:#94a3b8; margin-bottom:6px;">Live Visual Preview:</label>
    <div class="preview-wrap">
        <div id="tablePreview"></div>
    </div>

    <label style="display:block; font-size:13px; font-weight:600; color:#94a3b8; margin-bottom:6px;">Generated Clean HTML Code:</label>
    <textarea id="tableCode" class="code-box" readonly></textarea>
    <button class="btn-copy" onclick="copyTableHtml(this)">Copy HTML Code</button>
</div>
<script>
function renderTable() {
    let rows = parseInt(document.getElementById('tblRows').value, 10) || 3;
    let cols = parseInt(document.getElementById('tblCols').value, 10) || 3;
    let hasHeader = document.getElementById('tblHeader').checked;
    let isStriped = document.getElementById('tblStriped').checked;

    let html = '<table class="custom-table">\n';
    if (hasHeader) {
        html += '  <thead>\n    <tr>\n';
        for (let c = 1; c <= cols; c++) {
            html += `      <th>Header ${c}</th>\n`;
        }
        html += '    </tr>\n  </thead>\n';
    }

    html += '  <tbody>\n';
    for (let r = 1; r <= rows; r++) {
        html += '    <tr>\n';
        for (let c = 1; c <= cols; c++) {
            html += `      <td>Row ${r}, Cell ${c}</td>\n`;
        }
        html += '    </tr>\n';
    }
    html += '  </tbody>\n</table>';

    document.getElementById('tablePreview').innerHTML = html;
    
    // If striped
    if (isStriped) {
        let trs = document.querySelectorAll('#tablePreview tbody tr');
        trs.forEach((tr, i) => {
            if (i % 2 === 1) tr.style.backgroundColor = '#131b2e';
        });
    }

    document.getElementById('tableCode').value = html;
}

function copyTableHtml(btn) {
    let t = document.getElementById('tableCode').value;
    if (!t) return;
    navigator.clipboard.writeText(t).then(() => {
        let orig = btn.textContent;
        btn.textContent = 'Copied!';
        setTimeout(() => btn.textContent = orig, 1500);
    });
}
renderTable();
</script>
