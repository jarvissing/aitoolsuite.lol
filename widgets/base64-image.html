<style>
.tool-container { font-family: system-ui, -apple-system, sans-serif; background: #111827; padding: 24px; border-radius: 12px; box-sizing: border-box; max-width: 860px; margin: 0 auto; color: #f8fafc; }
.drop-zone { border: 2px dashed #334155; border-radius: 10px; padding: 30px; text-align: center; background: #0b0f19; cursor: pointer; margin-bottom: 16px; transition: border-color 0.2s; }
.drop-zone:hover { border-color: #3b82f6; }
.output-code { width: 100%; height: 160px; background: #0b0f19; color: #38bdf8; border: 1px solid #334155; border-radius: 8px; padding: 12px; box-sizing: border-box; font-family: monospace; font-size: 12px; resize: vertical; margin-bottom: 12px; }
.btn-copy { background: #3b82f6; color: #fff; border: none; padding: 10px 18px; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 600; }
</style>
<div class="tool-container">
    <div class="drop-zone" onclick="document.getElementById('fileIn').click()">
        <input type="file" id="fileIn" accept="image/*" style="display:none;" onchange="handleFile(this.files[0])">
        <div style="font-size:32px; margin-bottom:8px;">🖼️</div>
        <div style="font-size:14px; font-weight:600; color:#cbd5e1;">Click or Drag & Drop Image Here</div>
        <div style="font-size:12px; color:#64748b; margin-top:4px;">Supports PNG, JPG, SVG, WebP, GIF</div>
    </div>
    <label style="display:block; font-size:13px; font-weight:600; color:#94a3b8; margin-bottom:6px;">Base64 Data URI Output:</label>
    <textarea id="base64ImgOut" class="output-code" readonly placeholder="data:image/png;base64,..."></textarea>
    <button class="btn-copy" onclick="copyBase64Img(this)">Copy Base64 Data URI</button>
</div>
<script>
function handleFile(file) {
    if (!file) return;
    let reader = new FileReader();
    reader.onload = function(e) {
        document.getElementById('base64ImgOut').value = e.target.result;
    };
    reader.readAsDataURL(file);
}
function copyBase64Img(btn) {
    let t = document.getElementById('base64ImgOut').value;
    if (!t) return;
    navigator.clipboard.writeText(t).then(() => {
        let orig = btn.textContent;
        btn.textContent = 'Copied!';
        setTimeout(() => btn.textContent = orig, 1800);
    });
}
</script>
