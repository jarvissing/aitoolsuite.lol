<style>
.tool-container { font-family: system-ui, -apple-system, sans-serif; background: #f8f9fa; padding: 20px; border-radius: 8px; box-sizing: border-box; max-width: 800px; margin: 0 auto; color: #333; }
.tool-container input[type="number"] { width: 100px; background: #fff; border: 1px solid #ddd; border-radius: 8px; padding: 10px; box-sizing: border-box; margin-bottom: 10px; margin-right: 10px; font-family: inherit; }
.tool-container button { background: #4361ee; color: white; border: none; padding: 10px 15px; border-radius: 8px; cursor: pointer; font-size: 14px; margin-right: 5px; margin-bottom: 10px; transition: background 0.2s; }
.tool-container button:hover { background: #324ccc; }
.tool-container .output { background: #fff; border: 1px solid #ddd; border-radius: 8px; padding: 15px; min-height: 200px; max-height: 400px; overflow-y: auto; white-space: pre-wrap; margin-bottom: 10px; line-height: 1.6; }
</style>
<div class="tool-container">
    <div style="display: flex; align-items: center; flex-wrap: wrap;">
        <label style="margin-right: 10px;">Paragraphs:</label>
        <input type="number" id="lorem-count" min="1" max="20" value="3">
        <button onclick="generateLorem()">Generate</button>
        <button onclick="copyLorem(this)">Copy Text</button>
    </div>
    <div id="lorem-output" class="output"></div>
</div>
<script>
const loremText = "Lorem ipsum dolor sit amet, consectetur adipiscing elit. Sed do eiusmod tempor incididunt ut labore et dolore magna aliqua. Ut enim ad minim veniam, quis nostrud exercitation ullamco laboris nisi ut aliquip ex ea commodo consequat. Duis aute irure dolor in reprehenderit in voluptate velit esse cillum dolore eu fugiat nulla pariatur. Excepteur sint occaecat cupidatat non proident, sunt in culpa qui officia deserunt mollit anim id est laborum.";
function generateLorem() {
    let count = parseInt(document.getElementById('lorem-count').value) || 3;
    if (count < 1) count = 1;
    if (count > 20) count = 20;
    
    let result = [];
    for(let i=0; i<count; i++) {
        // slightly scramble or just repeat for simple variation
        result.push(loremText);
    }
    document.getElementById('lorem-output').textContent = result.join('\n\n');
}
function copyLorem(btn) {
    const text = document.getElementById('lorem-output').textContent;
    if (!text) return;
    navigator.clipboard.writeText(text).then(() => {
        const orig = btn.textContent;
        btn.textContent = 'Copied!';
        setTimeout(() => btn.textContent = orig, 2000);
    });
}
// Initial generation
generateLorem();
</script>
