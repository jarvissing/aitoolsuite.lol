<style>
.tool-container { font-family: system-ui, -apple-system, sans-serif; background: #121217; padding: 24px; border-radius: 12px; box-sizing: border-box; max-width: 840px; margin: 0 auto; color: #f1f5f9; border: 1px solid rgba(255, 255, 255, 0.08); }
.tool-container h3 { font-size: 15px; margin-top: 0; margin-bottom: 8px; color: #e2e8f0; }
.tool-container textarea { width: 100%; background: #1a1a24; border: 1px solid rgba(255, 255, 255, 0.12); border-radius: 8px; padding: 12px; box-sizing: border-box; font-family: 'JetBrains Mono', monospace; font-size: 13px; color: #f8fafc; margin-bottom: 12px; min-height: 140px; resize: vertical; }
.tool-container textarea:focus { outline: none; border-color: #6366f1; }
.tool-container .btn-group { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; align-items: center; }
.tool-container button { background: #4f46e5; color: white; border: none; padding: 9px 16px; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 500; transition: all 0.2s; }
.tool-container button:hover { background: #4338ca; }
.tool-container .copy-btn { background: #10b981; }
.tool-container .copy-btn:hover { background: #059669; }
.tool-container label { font-size: 13px; color: #cbd5e1; display: flex; align-items: center; gap: 6px; cursor: pointer; margin-left: 10px; }
.tool-container input[type="checkbox"] { accent-color: #4f46e5; }
</style>
<div class="tool-container">
    <h3>Input HTML Markup</h3>
    <textarea id="html-raw-input" placeholder="<p>Paste your <strong>HTML</strong> content here...</p>"></textarea>
    
    <div class="btn-group">
        <button onclick="stripHtmlTags()">Extract Plain Text</button>
        <label><input type="checkbox" id="strip-links" checked> Remove Link URLs</label>
        <label><input type="checkbox" id="normalize-spaces" checked> Collapse Extra Whitespace</label>
        <button onclick="copyStrippedText(this)" class="copy-btn">Copy Plain Text</button>
    </div>
    
    <h3>Extracted Plain Text</h3>
    <textarea id="html-plain-output" placeholder="Clean plain text will appear here..." readonly></textarea>
</div>
<script>
function stripHtmlTags() {
    const raw = document.getElementById('html-raw-input').value;
    const output = document.getElementById('html-plain-output');
    if (!raw.trim()) { output.value = ''; return; }
    
    const stripLinks = document.getElementById('strip-links').checked;
    const normalizeSpaces = document.getElementById('normalize-spaces').checked;
    
    // Parse using browser DOM
    const parser = new DOMParser();
    const doc = parser.parseFromString(raw, 'text/html');
    
    // Remove scripts, styles, and SVG
    const removeElements = doc.querySelectorAll('script, style, svg, noscript');
    removeElements.forEach(el => el.remove());
    
    let text = doc.body.textContent || "";
    
    if (normalizeSpaces) {
        text = text.replace(/[ \t]+/g, ' ').replace(/\n\s*\n+/g, '\n\n').trim();
    }
    
    output.value = text;
}

function copyStrippedText(btn) {
    const out = document.getElementById('html-plain-output').value;
    if (!out) return;
    navigator.clipboard.writeText(out).then(() => {
        const orig = btn.textContent;
        btn.textContent = 'Copied!';
        setTimeout(() => btn.textContent = orig, 2000);
    });
}
document.getElementById('html-raw-input').addEventListener('input', stripHtmlTags);
</script>
