<style>
.tool-container { font-family: system-ui, -apple-system, sans-serif; background: #111827; padding: 24px; border-radius: 12px; box-sizing: border-box; max-width: 900px; margin: 0 auto; color: #f8fafc; }
.tool-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px; }
@media (max-width: 640px) { .tool-grid { grid-template-columns: 1fr; } }
.col label { display: flex; justify-content: space-between; font-size: 13px; font-weight: 600; color: #94a3b8; margin-bottom: 6px; }
.col textarea { width: 100%; height: 230px; background: #0b0f19; color: #f8fafc; border: 1px solid #334155; border-radius: 8px; padding: 12px; box-sizing: border-box; font-family: monospace; font-size: 13px; resize: vertical; }
.stats-bar { font-size: 12px; color: #38bdf8; font-family: monospace; margin-bottom: 14px; background: #0b0f19; padding: 8px 12px; border-radius: 6px; border: 1px solid #1e293b; display: flex; gap: 16px; flex-wrap: wrap; }
.btn-row { display: flex; gap: 10px; }
.btn-act { background: #3b82f6; color: #fff; border: none; padding: 10px 18px; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 13px; }
.btn-copy { background: #1e293b; color: #38bdf8; border: 1px solid #334155; padding: 10px 16px; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 600; }
</style>
<div class="tool-container">
    <div class="stats-bar">
        <span id="origSize">Original: 0 bytes</span>
        <span id="miniSize">Minified: 0 bytes</span>
        <span id="savedSize" style="color: #4ade80;">Saved: 0%</span>
    </div>
    <div class="tool-grid">
        <div class="col">
            <label><span>Pretty JSON Input:</span></label>
            <textarea id="jsonMinIn" placeholder="{&#10;  &quot;title&quot;: &quot;Developer Tool Suite&quot;,&#10;  &quot;status&quot;: &quot;active&quot;,&#10;  &quot;count&quot;: 47&#10;}" oninput="minifyJson()"></textarea>
        </div>
        <div class="col">
            <label><span>Minified Compact JSON:</span></label>
            <textarea id="jsonMinOut" readonly placeholder="{&quot;title&quot;:&quot;Developer Tool Suite&quot;,&quot;status&quot;:&quot;active&quot;,&quot;count&quot;:47}"></textarea>
        </div>
    </div>
    <div class="btn-row">
        <button class="btn-act" onclick="minifyJson()">Minify JSON</button>
        <button class="btn-copy" onclick="copyMinifiedJson(this)">Copy Minified JSON</button>
    </div>
</div>
<script>
function minifyJson() {
    let raw = document.getElementById('jsonMinIn').value;
    if (!raw.trim()) {
        document.getElementById('jsonMinOut').value = '';
        document.getElementById('origSize').textContent = 'Original: 0 bytes';
        document.getElementById('miniSize').textContent = 'Minified: 0 bytes';
        document.getElementById('savedSize').textContent = 'Saved: 0%';
        return;
    }
    try {
        let parsed = JSON.parse(raw);
        let minified = JSON.stringify(parsed);
        document.getElementById('jsonMinOut').value = minified;
        
        let origB = new Blob([raw]).size;
        let miniB = new Blob([minified]).size;
        let saved = origB > 0 ? Math.round(((origB - miniB) / origB) * 100) : 0;
        
        document.getElementById('origSize').textContent = `Original: ${origB} bytes`;
        document.getElementById('miniSize').textContent = `Minified: ${miniB} bytes`;
        document.getElementById('savedSize').textContent = `Saved: ${Math.max(0, saved)}%`;
    } catch(e) {
        document.getElementById('jsonMinOut').value = 'Invalid JSON: ' + e.message;
    }
}

function copyMinifiedJson(btn) {
    let t = document.getElementById('jsonMinOut').value;
    if (!t || t.startsWith('Invalid JSON')) return;
    navigator.clipboard.writeText(t).then(() => {
        let orig = btn.textContent;
        btn.textContent = 'Copied!';
        setTimeout(() => btn.textContent = orig, 1800);
    });
}
minifyJson();
</script>
