<style>
.tool-container { font-family: system-ui, -apple-system, sans-serif; background: #121217; padding: 24px; border-radius: 12px; box-sizing: border-box; max-width: 840px; margin: 0 auto; color: #f1f5f9; border: 1px solid rgba(255, 255, 255, 0.08); }
.tool-container h3 { font-size: 15px; margin-top: 0; margin-bottom: 8px; color: #e2e8f0; }
.tool-container textarea { width: 100%; background: #1a1a24; border: 1px solid rgba(255, 255, 255, 0.12); border-radius: 8px; padding: 12px; box-sizing: border-box; font-family: 'JetBrains Mono', monospace; font-size: 13px; color: #f8fafc; margin-bottom: 12px; min-height: 120px; resize: vertical; }
.tool-container .controls { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; flex-wrap: wrap; }
.tool-container select, .tool-container input[type="number"] { background: #1a1a24; border: 1px solid rgba(255, 255, 255, 0.12); border-radius: 6px; padding: 8px 12px; color: #fff; font-size: 13px; }
.tool-container button { background: #4f46e5; color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 500; }
.tool-container button:hover { background: #4338ca; }
.tool-container .copy-btn { background: #10b981; }
.tool-container .copy-btn:hover { background: #059669; }
</style>
<div class="tool-container">
    <h3>Input Text</h3>
    <textarea id="rot-in" placeholder="Type or paste your text here to encode or decode..."></textarea>
    
    <div class="controls">
        <label style="font-size: 13px; color: #94a3b8;">Shift Amount:</label>
        <select id="rot-shift" onchange="runCipher()">
            <option value="13" selected>ROT13 (Standard 13 positions)</option>
            <option value="1">Caesar Shift +1</option>
            <option value="3">Caesar Shift +3 (Classic)</option>
            <option value="5">Shift +5</option>
            <option value="18">ROT18 (Alphanumeric)</option>
            <option value="47">ROT47 (ASCII 33-126)</option>
        </select>
        <button onclick="runCipher()">Transform Text</button>
        <button onclick="copyRotResult(this)" class="copy-btn">Copy Output</button>
    </div>
    
    <h3>Cipher Output</h3>
    <textarea id="rot-out" placeholder="Ciphered output will appear here..." readonly></textarea>
</div>
<script>
function runCipher() {
    const text = document.getElementById('rot-in').value;
    const shiftMode = document.getElementById('rot-shift').value;
    const out = document.getElementById('rot-out');
    if (!text) { out.value = ''; return; }

    if (shiftMode === "47") {
        let res = '';
        for (let i = 0; i < text.length; i++) {
            let code = text.charCodeAt(i);
            if (code >= 33 && code <= 126) {
                res += String.fromCharCode(33 + ((code + 14) % 94));
            } else {
                res += text[i];
            }
        }
        out.value = res;
        return;
    }

    const shift = parseInt(shiftMode) || 13;
    let res = '';
    for (let i = 0; i < text.length; i++) {
        let c = text[i];
        if (c >= 'a' && c <= 'z') {
            res += String.fromCharCode(((c.charCodeAt(0) - 97 + shift) % 26) + 97);
        } else if (c >= 'A' && c <= 'Z') {
            res += String.fromCharCode(((c.charCodeAt(0) - 65 + shift) % 26) + 65);
        } else if (shiftMode === "18" && c >= '0' && c <= '9') {
            res += String.fromCharCode(((c.charCodeAt(0) - 48 + 5) % 10) + 48);
        } else {
            res += c;
        }
    }
    out.value = res;
}

function copyRotResult(btn) {
    const text = document.getElementById('rot-out').value;
    if (!text) return;
    navigator.clipboard.writeText(text).then(() => {
        const orig = btn.textContent;
        btn.textContent = 'Copied!';
        setTimeout(() => btn.textContent = orig, 2000);
    });
}
document.getElementById('rot-in').addEventListener('input', runCipher);
</script>
