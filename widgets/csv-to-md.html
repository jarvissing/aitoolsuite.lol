<style>
.tool-container { font-family: system-ui, -apple-system, sans-serif; background: #111827; padding: 24px; border-radius: 12px; box-sizing: border-box; max-width: 900px; margin: 0 auto; color: #f8fafc; }
.tool-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px; }
@media (max-width: 640px) { .tool-grid { grid-template-columns: 1fr; } }
.col label { display: block; font-size: 13px; font-weight: 600; color: #94a3b8; margin-bottom: 6px; }
.col textarea { width: 100%; height: 240px; background: #0b0f19; color: #f8fafc; border: 1px solid #334155; border-radius: 8px; padding: 12px; box-sizing: border-box; font-family: monospace; font-size: 13px; resize: vertical; }
.btn-row { display: flex; gap: 10px; }
.btn-act { background: #3b82f6; color: #fff; border: none; padding: 10px 18px; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 13px; }
.btn-copy { background: #1e293b; color: #38bdf8; border: 1px solid #334155; padding: 10px 16px; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 600; }
</style>
<div class="tool-container">
    <div class="tool-grid">
        <div class="col">
            <label>CSV Input:</label>
            <textarea id="csvIn" placeholder="Name,Role,Country&#10;Alice,Engineer,Canada&#10;Bob,Designer,USA&#10;Charlie,Product,UK" oninput="convertCsvToMd()"></textarea>
        </div>
        <div class="col">
            <label>Markdown Table Output:</label>
            <textarea id="mdOut" readonly placeholder="| Name | Role | Country |&#10;| --- | --- | --- |..."></textarea>
        </div>
    </div>
    <div class="btn-row">
        <button class="btn-act" onclick="convertCsvToMd()">Convert to Markdown</button>
        <button class="btn-copy" onclick="copyMdText(this)">Copy Markdown Table</button>
    </div>
</div>
<script>
function parseCsvLine(line) {
    let result = [];
    let cur = '';
    let inQuotes = false;
    for (let i = 0; i < line.length; i++) {
        let c = line[i];
        if (c === '"') {
            inQuotes = !inQuotes;
        } else if (c === ',' && !inQuotes) {
            result.push(cur.trim());
            cur = '';
        } else {
            cur += c;
        }
    }
    result.push(cur.trim());
    return result;
}

function convertCsvToMd() {
    let raw = document.getElementById('csvIn').value.trim();
    if (!raw) {
        document.getElementById('mdOut').value = '';
        return;
    }
    let lines = raw.split(/\r?\n/).filter(l => l.trim().length > 0);
    if (lines.length === 0) return;
    
    let parsedRows = lines.map(parseCsvLine);
    let maxCols = Math.max(...parsedRows.map(r => r.length));
    
    // Normalize row lengths
    parsedRows = parsedRows.map(row => {
        while (row.length < maxCols) row.push('');
        return row;
    });
    
    let header = parsedRows[0];
    let md = '| ' + header.join(' | ') + ' |\n';
    md += '| ' + header.map(() => '---').join(' | ') + ' |\n';
    
    for (let i = 1; i < parsedRows.length; i++) {
        md += '| ' + parsedRows[i].join(' | ') + ' |\n';
    }
    
    document.getElementById('mdOut').value = md.trim();
}

function copyMdText(btn) {
    let t = document.getElementById('mdOut').value;
    if (!t) return;
    navigator.clipboard.writeText(t).then(() => {
        let orig = btn.textContent;
        btn.textContent = 'Copied!';
        setTimeout(() => btn.textContent = orig, 1800);
    });
}
convertCsvToMd();
</script>
