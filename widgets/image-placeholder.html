<style>
.tool-container { font-family: system-ui, -apple-system, sans-serif; background: #111827; padding: 24px; border-radius: 12px; box-sizing: border-box; max-width: 860px; margin: 0 auto; color: #f8fafc; }
.tool-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 14px; margin-bottom: 20px; }
@media (max-width: 600px) { .tool-grid { grid-template-columns: 1fr; } }
.field label { display: block; font-size: 13px; font-weight: 600; color: #94a3b8; margin-bottom: 6px; }
.field input { width: 100%; background: #0b0f19; color: #f8fafc; border: 1px solid #334155; border-radius: 8px; padding: 10px; box-sizing: border-box; font-family: inherit; font-size: 14px; }
.placeholder-view { background: #1e293b; border-radius: 10px; min-height: 180px; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 700; color: #94a3b8; margin-bottom: 16px; border: 1px solid rgba(255,255,255,0.1); }
.btn-row { display: flex; gap: 10px; }
.btn-act { background: #3b82f6; color: #fff; border: none; padding: 10px 18px; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 600; }
</style>
<div class="tool-container">
    <div class="tool-grid">
        <div class="field">
            <label>Width (px):</label>
            <input type="number" id="phW" value="600" oninput="genPlaceholder()">
        </div>
        <div class="field">
            <label>Height (px):</label>
            <input type="number" id="phH" value="400" oninput="genPlaceholder()">
        </div>
        <div class="field">
            <label>Custom Text:</label>
            <input type="text" id="phText" value="600x400" oninput="genPlaceholder()">
        </div>
    </div>
    <div id="phPreview" class="placeholder-view">600 x 400</div>
    <div class="btn-row">
        <button class="btn-act" onclick="downloadSvg()">Download SVG Image</button>
        <button class="btn-act" style="background:#1e293b; color:#38bdf8;" onclick="copySvgCode(this)">Copy SVG Code</button>
    </div>
</div>
<script>
function genPlaceholder() {
    let w = document.getElementById('phW').value || 600;
    let h = document.getElementById('phH').value || 400;
    let t = document.getElementById('phText').value || `${w}x${h}`;
    let p = document.getElementById('phPreview');
    p.style.aspectRatio = `${w}/${h}`;
    p.textContent = t;
}
function getSvgData() {
    let w = document.getElementById('phW').value || 600;
    let h = document.getElementById('phH').value || 400;
    let t = document.getElementById('phText').value || `${w}x${h}`;
    return `<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><rect width="100%" height="100%" fill="#1e293b"/><text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" font-family="system-ui, sans-serif" font-size="${Math.min(w,h)/8}px" fill="#94a3b8" font-weight="700">${t}</text></svg>`;
}
function downloadSvg() {
    let svg = getSvgData();
    let blob = new Blob([svg], {type: 'image/svg+xml'});
    let a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `placeholder-${document.getElementById('phW').value}x${document.getElementById('phH').value}.svg`;
    a.click();
}
function copySvgCode(btn) {
    let svg = getSvgData();
    navigator.clipboard.writeText(svg).then(() => {
        let orig = btn.textContent;
        btn.textContent = 'Copied!';
        setTimeout(() => btn.textContent = orig, 1800);
    });
}
genPlaceholder();
</script>
