<style>
.tool-container { font-family: system-ui, -apple-system, sans-serif; background: #111827; padding: 24px; border-radius: 12px; box-sizing: border-box; max-width: 900px; margin: 0 auto; color: #f8fafc; }
.tool-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px; }
@media (max-width: 640px) { .tool-grid { grid-template-columns: 1fr; } }
.col label { display: block; font-size: 13px; font-weight: 600; color: #94a3b8; margin-bottom: 6px; }
.col textarea { width: 100%; height: 220px; background: #0b0f19; color: #f8fafc; border: 1px solid #334155; border-radius: 8px; padding: 12px; box-sizing: border-box; font-family: monospace; font-size: 13px; resize: vertical; }
.btn-row { display: flex; gap: 10px; }
.btn-act { background: #3b82f6; color: #fff; border: none; padding: 10px 18px; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 13px; }
.btn-copy { background: #1e293b; color: #38bdf8; border: 1px solid #334155; padding: 10px 16px; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 600; }
</style>
<div class="tool-container">
    <div class="tool-grid">
        <div class="col">
            <label>JSON Object Input:</label>
            <textarea id="jsonEnvIn" placeholder="{&#10;  &quot;PORT&quot;: 8080,&#10;  &quot;NODE_ENV&quot;: &quot;production&quot;,&#10;  &quot;DATABASE_URL&quot;: &quot;postgresql://localhost:5432/mydb&quot;&#10;}" oninput="convertJsonToEnv()"></textarea>
        </div>
        <div class="col">
            <label>.env Output Format:</label>
            <textarea id="envJsonOut" readonly placeholder=".env output will appear here..."></textarea>
        </div>
    </div>
    <div class="btn-row">
        <button class="btn-act" onclick="convertJsonToEnv()">Convert to .env</button>
        <button class="btn-copy" onclick="copyEnvText(this)">Copy .env</button>
    </div>
</div>
<script>
function convertJsonToEnv() {
    let raw = document.getElementById('jsonEnvIn').value.trim();
    if (!raw) {
        document.getElementById('envJsonOut').value = '';
        return;
    }
    try {
        let obj = JSON.parse(raw);
        let lines = [];
        for (let [k, v] of Object.entries(obj)) {
            let strVal = typeof v === 'object' ? JSON.stringify(v) : String(v);
            if (strVal.includes(' ') || strVal.includes('\n')) {
                strVal = `"${strVal.replace(/"/g, '\\"')}"`;
            }
            lines.push(`${k}=${strVal}`);
        }
        document.getElementById('envJsonOut').value = lines.join('\n');
    } catch(e) {
        document.getElementById('envJsonOut').value = 'Invalid JSON: ' + e.message;
    }
}
function copyEnvText(btn) {
    let t = document.getElementById('envJsonOut').value;
    if (!t) return;
    navigator.clipboard.writeText(t).then(() => {
        let orig = btn.textContent;
        btn.textContent = 'Copied!';
        setTimeout(() => btn.textContent = orig, 1800);
    });
}
convertJsonToEnv();
</script>
