<style>
.tool-container { font-family: system-ui, -apple-system, sans-serif; background: #111827; padding: 24px; border-radius: 12px; box-sizing: border-box; max-width: 860px; margin: 0 auto; color: #f8fafc; }
.input-row { display: flex; gap: 12px; margin-bottom: 20px; align-items: flex-end; flex-wrap: wrap; }
.input-group { flex-grow: 1; min-width: 200px; }
.input-group label { display: block; font-size: 13px; font-weight: 600; color: #94a3b8; margin-bottom: 6px; }
.input-field { width: 100%; background: #0b0f19; color: #f8fafc; border: 1px solid #334155; border-radius: 8px; padding: 10px 14px; font-family: monospace; font-size: 14px; box-sizing: border-box; }
.results-table { width: 100%; border-collapse: collapse; font-family: monospace; font-size: 13px; margin-top: 16px; background: #0b0f19; border-radius: 8px; overflow: hidden; border: 1px solid #1e293b; }
.results-table th, .results-table td { padding: 10px 16px; text-align: left; border-bottom: 1px solid #1e293b; }
.results-table th { background: #080c14; color: #94a3b8; font-weight: 600; width: 35%; }
.results-table td { color: #38bdf8; word-break: break-all; }
.results-table tr:last-child th, .results-table tr:last-child td { border-bottom: none; }
</style>
<div class="tool-container">
    <div class="input-row">
        <div class="input-group">
            <label>IP Address / CIDR Block:</label>
            <input type="text" id="cidrInput" class="input-field" value="192.168.1.15/24" oninput="calculateCidr()" placeholder="192.168.1.0/24">
        </div>
        <div style="min-width: 140px;">
            <label>Subnet Mask (/Bits):</label>
            <select id="cidrBits" class="input-field" onchange="onBitsChange()">
                <!-- Generated by JS -->
            </select>
        </div>
    </div>

    <table class="results-table">
        <tbody>
            <tr><th>Netmask:</th><td id="resNetmask">255.255.255.0</td></tr>
            <tr><th>Network IP:</th><td id="resNetwork">192.168.1.0</td></tr>
            <tr><th>Broadcast IP:</th><td id="resBroadcast">192.168.1.255</td></tr>
            <tr><th>First Usable Host:</th><td id="resFirst">192.168.1.1</td></tr>
            <tr><th>Last Usable Host:</th><td id="resLast">192.168.1.254</td></tr>
            <tr><th>Total IP Addresses:</th><td id="resTotal">256</td></tr>
            <tr><th>Usable Hosts:</th><td id="resUsable">254</td></tr>
            <tr><th>Wildcard Mask:</th><td id="resWildcard">0.0.0.255</td></tr>
        </tbody>
    </table>
</div>
<script>
// Populate CIDR dropdown
const sel = document.getElementById('cidrBits');
for (let i = 1; i <= 32; i++) {
    let opt = document.createElement('option');
    opt.value = i;
    opt.textContent = `/${i}`;
    if (i === 24) opt.selected = true;
    sel.appendChild(opt);
}

function ipToLong(ip) {
    let parts = ip.split('.');
    if (parts.length !== 4) return null;
    let n = 0;
    for (let p of parts) {
        let val = parseInt(p, 10);
        if (isNaN(val) || val < 0 || val > 255) return null;
        n = (n << 8) + val;
    }
    return n >>> 0;
}

function longToIp(num) {
    return [
        (num >>> 24) & 255,
        (num >>> 16) & 255,
        (num >>> 8) & 255,
        num & 255
    ].join('.');
}

function calculateCidr() {
    let val = document.getElementById('cidrInput').value.trim();
    let parts = val.split('/');
    let ipStr = parts[0];
    let maskBits = parts.length > 1 ? parseInt(parts[1], 10) : parseInt(document.getElementById('cidrBits').value, 10);

    if (isNaN(maskBits) || maskBits < 1 || maskBits > 32) maskBits = 24;
    document.getElementById('cidrBits').value = maskBits;

    let ipLong = ipToLong(ipStr);
    if (ipLong === null) {
        document.getElementById('resNetmask').textContent = 'Invalid IPv4 address';
        return;
    }

    let maskLong = maskBits === 0 ? 0 : (~0 << (32 - maskBits)) >>> 0;
    let wildcardLong = (~maskLong) >>> 0;
    let networkLong = (ipLong & maskLong) >>> 0;
    let broadcastLong = (networkLong | wildcardLong) >>> 0;

    let total = Math.pow(2, 32 - maskBits);
    let usable = maskBits >= 31 ? (maskBits === 31 ? 2 : 1) : total - 2;

    let firstUsable = maskBits >= 31 ? networkLong : networkLong + 1;
    let lastUsable = maskBits >= 31 ? broadcastLong : broadcastLong - 1;

    document.getElementById('resNetmask').textContent = longToIp(maskLong);
    document.getElementById('resNetwork').textContent = longToIp(networkLong);
    document.getElementById('resBroadcast').textContent = longToIp(broadcastLong);
    document.getElementById('resFirst').textContent = longToIp(firstUsable);
    document.getElementById('resLast').textContent = longToIp(lastUsable);
    document.getElementById('resTotal').textContent = total.toLocaleString();
    document.getElementById('resUsable').textContent = usable.toLocaleString();
    document.getElementById('resWildcard').textContent = longToIp(wildcardLong);
}

function onBitsChange() {
    let b = document.getElementById('cidrBits').value;
    let cur = document.getElementById('cidrInput').value.trim().split('/')[0];
    document.getElementById('cidrInput').value = `${cur}/${b}`;
    calculateCidr();
}
calculateCidr();
</script>
