<style>
.jg-container {
    max-width: 800px;
    margin: 0 auto;
    font-family: 'Inter', system-ui, sans-serif;
    color: #e2e8f0;
}
.jg-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
    margin-bottom: 16px;
}
@media (max-width: 700px) {
    .jg-grid { grid-template-columns: 1fr; }
}
.jg-panel {
    background: #121216;
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 12px;
    padding: 14px;
    display: flex;
    flex-direction: column;
}
.jg-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
}
.jg-title {
    font-size: 0.8rem;
    font-weight: 700;
    color: #94a3b8;
    text-transform: uppercase;
}
.jg-textarea {
    width: 100%;
    height: 280px;
    background: #09090b;
    border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: 8px;
    padding: 12px;
    color: #38bdf8;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.85rem;
    resize: vertical;
    outline: none;
    box-sizing: border-box;
}
.jg-textarea:focus { border-color: #3b82f6; }
.jg-btn {
    background: #3b82f6;
    color: #fff;
    border: none;
    border-radius: 6px;
    padding: 6px 12px;
    font-size: 0.78rem;
    font-weight: 600;
    cursor: pointer;
}
.jg-btn:hover { background: #2563eb; }
.jg-btn-secondary {
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid rgba(255, 255, 255, 0.12);
    color: #cbd5e1;
}
.jg-btn-secondary:hover { background: rgba(255, 255, 255, 0.12); }
</style>

<div class="jg-container">
    <div class="jg-grid">
        <div class="jg-panel">
            <div class="jg-header">
                <span class="jg-title">JSON Input</span>
                <button class="jg-btn jg-btn-secondary" onclick="loadGoSample()">Load Sample</button>
            </div>
            <textarea id="goJsonInput" class="jg-textarea" placeholder="Paste your JSON here..." oninput="convertJsonToGo()"></textarea>
        </div>
        <div class="jg-panel">
            <div class="jg-header">
                <span class="jg-title">Go Struct Definitions</span>
                <button class="jg-btn" onclick="copyGoCode(this)">Copy Go Struct</button>
            </div>
            <textarea id="goOutput" class="jg-textarea" readonly style="color:#4ade80;"></textarea>
        </div>
    </div>
</div>

<script>
function toPascalCaseGo(str) {
    return str.replace(/(?:^|[-_])(\w)/g, (_, c) => c.toUpperCase());
}

function convertJsonToGo() {
    const raw = document.getElementById('goJsonInput').value.trim();
    const outputEl = document.getElementById('goOutput');
    if (!raw) {
        outputEl.value = '';
        return;
    }

    try {
        const parsed = JSON.parse(raw);
        const structs = [];
        const seenNames = new Set();

        function parseGoObj(obj, structName = "Root") {
            const cleanName = toPascalCaseGo(structName);
            if (seenNames.has(cleanName)) return cleanName;
            seenNames.add(cleanName);

            let lines = [`type ${cleanName} struct {`];

            for (const [key, val] of Object.entries(obj)) {
                const pascalField = toPascalCaseGo(key);
                let goType = "any";

                if (val === null) {
                    goType = "*any";
                } else if (typeof val === "boolean") {
                    goType = "bool";
                } else if (typeof val === "number") {
                    goType = Number.isInteger(val) ? "int64" : "float64";
                } else if (typeof val === "string") {
                    goType = "string";
                } else if (Array.isArray(val)) {
                    if (val.length > 0 && typeof val[0] === "object" && val[0] !== null) {
                        const subName = parseGoObj(val[0], key + "Item");
                        goType = `[]${subName}`;
                    } else if (val.length > 0) {
                        const itemType = typeof val[0] === "number" ? (Number.isInteger(val[0]) ? "int64" : "float64") : (typeof val[0] === "boolean" ? "bool" : "string");
                        goType = `[]${itemType}`;
                    } else {
                        goType = "[]any";
                    }
                } else if (typeof val === "object") {
                    const subName = parseGoObj(val, key);
                    goType = subName;
                }

                lines.push(`\t${pascalField}\t${goType}\t\`json:"${key}"\``);
            }

            lines.push(`}\n`);
            structs.push(lines.join('\n'));
            return cleanName;
        }

        if (Array.isArray(parsed)) {
            if (parsed.length > 0 && typeof parsed[0] === "object") {
                parseGoObj(parsed[0], "Item");
                structs.unshift(`type Root []Item\n`);
            } else {
                structs.push(`type Root []any\n`);
            }
        } else if (typeof parsed === "object" && parsed !== null) {
            parseGoObj(parsed, "AutoGenerated");
        } else {
            outputEl.value = "// Please provide a valid JSON object or array.";
            return;
        }

        outputEl.value = structs.reverse().join('\n');
    } catch (e) {
        outputEl.value = `// Invalid JSON: ${e.message}`;
    }
}

function loadGoSample() {
    const sample = {
        "status": "success",
        "code": 200,
        "data": {
            "userId": 42,
            "email": "alex@example.com",
            "isVerified": true,
            "tags": ["golang", "microservices"],
            "settings": {
                "theme": "dark",
                "notificationsEnabled": true
            }
        }
    };
    document.getElementById('goJsonInput').value = JSON.stringify(sample, null, 2);
    convertJsonToGo();
}

function copyGoCode(btn) {
    const code = document.getElementById('goOutput').value;
    if (window.copyToClipboard) {
        window.copyToClipboard(code, btn, 'Copied!');
    } else {
        navigator.clipboard.writeText(code).then(() => {
            btn.innerText = 'Copied!';
            setTimeout(() => btn.innerText = 'Copy Go Struct', 1500);
        });
    }
}

document.addEventListener('DOMContentLoaded', loadGoSample);
</script>
