<style>
.tool-container { font-family: system-ui, -apple-system, sans-serif; background: #f8f9fa; padding: 20px; border-radius: 8px; box-sizing: border-box; max-width: 800px; margin: 0 auto; color: #333; }
.tool-container textarea { width: 100%; background: #fff; border: 1px solid #ddd; border-radius: 8px; padding: 10px; box-sizing: border-box; font-family: monospace; margin-bottom: 10px; min-height: 120px; resize: vertical; }
.tool-container button { background: #4361ee; color: white; border: none; padding: 10px 15px; border-radius: 8px; cursor: pointer; font-size: 14px; margin-right: 5px; margin-bottom: 10px; transition: background 0.2s; }
.tool-container button:hover { background: #324ccc; }
</style>
<div class="tool-container">
    <textarea id="url-input" placeholder="Enter text or URL to encode/decode..."></textarea>
    <div>
        <button onclick="processUrl('encode')">URL Encode</button>
        <button onclick="processUrl('decode')">URL Decode</button>
        <button onclick="copyUrl(this)">Copy Result</button>
    </div>
    <textarea id="url-output" placeholder="Result..." readonly></textarea>
</div>
<script>
function processUrl(action) {
    const input = document.getElementById('url-input').value;
    const output = document.getElementById('url-output');
    if (!input) { output.value = ''; return; }
    try {
        if (action === 'encode') {
            output.value = encodeURIComponent(input);
        } else {
            output.value = decodeURIComponent(input);
        }
    } catch (e) {
        output.value = 'Error: ' + e.message;
    }
}
function copyUrl(btn) {
    const text = document.getElementById('url-output').value;
    if (!text) return;
    navigator.clipboard.writeText(text).then(() => {
        const orig = btn.textContent;
        btn.textContent = 'Copied!';
        setTimeout(() => btn.textContent = orig, 2000);
    });
}
</script>
