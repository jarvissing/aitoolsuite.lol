<style>
.tool-container { font-family: system-ui, -apple-system, sans-serif; background: #121217; padding: 24px; border-radius: 12px; box-sizing: border-box; max-width: 840px; margin: 0 auto; color: #f1f5f9; border: 1px solid rgba(255, 255, 255, 0.08); }
.tool-container .row { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 16px; }
@media (max-width: 640px) { .tool-container .row { grid-template-columns: 1fr; } }
.tool-container .input-group { margin-bottom: 12px; }
.tool-container label { display: block; font-size: 13px; color: #94a3b8; margin-bottom: 4px; }
.tool-container input[type="text"], .tool-container input[type="number"] { width: 100%; background: #1a1a24; border: 1px solid rgba(255, 255, 255, 0.12); border-radius: 6px; padding: 8px 12px; color: #fff; font-size: 14px; box-sizing: border-box; }
.tool-container .preview-box { height: 100%; min-height: 120px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.15); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 16px; text-shadow: 0 1px 3px rgba(0,0,0,0.8); }
.tool-container .output-card { background: #1a1a24; border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 8px; padding: 12px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
.tool-container .output-card span { font-family: 'JetBrains Mono', monospace; font-size: 14px; color: #38bdf8; }
.tool-container button { background: #4f46e5; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 12px; }
.tool-container button:hover { background: #4338ca; }
</style>
<div class="tool-container">
    <div class="row">
        <div>
            <div class="input-group">
                <label>Hex Color</label>
                <input type="text" id="hex-in" value="#4f46e5" oninput="fromHex(this.value)">
            </div>
            <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px;">
                <div class="input-group">
                    <label>Red (0-255)</label>
                    <input type="number" id="r-in" min="0" max="255" value="79" oninput="fromRGB()">
                </div>
                <div class="input-group">
                    <label>Green (0-255)</label>
                    <input type="number" id="g-in" min="0" max="255" value="70" oninput="fromRGB()">
                </div>
                <div class="input-group">
                    <label>Blue (0-255)</label>
                    <input type="number" id="b-in" min="0" max="255" value="229" oninput="fromRGB()">
                </div>
            </div>
        </div>
        <div>
            <div class="preview-box" id="color-prev" style="background-color: #4f46e5; color: #fff;">
                Preview Color
            </div>
        </div>
    </div>
    
    <div class="output-card">
        <div><strong style="font-size: 12px; color: #94a3b8;">HSL:</strong> <span id="hsl-val">hsl(243, 75%, 59%)</span></div>
        <button onclick="copyVal('hsl-val', this)">Copy HSL</button>
    </div>
    <div class="output-card">
        <div><strong style="font-size: 12px; color: #94a3b8;">RGB:</strong> <span id="rgb-val">rgb(79, 70, 229)</span></div>
        <button onclick="copyVal('rgb-val', this)">Copy RGB</button>
    </div>
    <div class="output-card">
        <div><strong style="font-size: 12px; color: #94a3b8;">HSV / HSB:</strong> <span id="hsv-val">hsv(243, 69%, 90%)</span></div>
        <button onclick="copyVal('hsv-val', this)">Copy HSV</button>
    </div>
</div>
<script>
function rgbToHsl(r, g, b) {
    r /= 255; g /= 255; b /= 255;
    const max = Math.max(r, g, b), min = Math.min(r, g, b);
    let h, s, l = (max + min) / 2;

    if (max === min) {
        h = s = 0;
    } else {
        const d = max - min;
        s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
        switch (max) {
            case r: h = (g - b) / d + (g < b ? 6 : 0); break;
            case g: h = (b - r) / d + 2; break;
            case b: h = (r - g) / d + 4; break;
        }
        h /= 6;
    }
    return [Math.round(h * 360), Math.round(s * 100), Math.round(l * 100)];
}

function rgbToHsv(r, g, b) {
    r /= 255; g /= 255; b /= 255;
    const max = Math.max(r, g, b), min = Math.min(r, g, b);
    let h, s, v = max;
    const d = max - min;
    s = max === 0 ? 0 : d / max;
    if (max === min) {
        h = 0;
    } else {
        switch (max) {
            case r: h = (g - b) / d + (g < b ? 6 : 0); break;
            case g: h = (b - r) / d + 2; break;
            case b: h = (r - g) / d + 4; break;
        }
        h /= 6;
    }
    return [Math.round(h * 360), Math.round(s * 100), Math.round(v * 100)];
}

function updateValues(r, g, b) {
    const [h, s, l] = rgbToHsl(r, g, b);
    const [hv, sv, v] = rgbToHsv(r, g, b);
    
    document.getElementById('hsl-val').textContent = `hsl(${h}, ${s}%, ${l}%)`;
    document.getElementById('rgb-val').textContent = `rgb(${r}, ${g}, ${b})`;
    document.getElementById('hsv-val').textContent = `hsv(${hv}, ${sv}%, ${v}%)`;
    
    const hex = "#" + [r, g, b].map(x => x.toString(16).padStart(2, '0')).join('');
    document.getElementById('hex-in').value = hex;
    
    const prev = document.getElementById('color-prev');
    prev.style.backgroundColor = hex;
    prev.style.color = (r*0.299 + g*0.587 + b*0.114) > 150 ? '#000' : '#fff';
}

function fromHex(val) {
    val = val.replace(/^#/, '');
    if (val.length === 3) val = val.split('').map(c => c+c).join('');
    if (val.length === 6) {
        const r = parseInt(val.substring(0, 2), 16);
        const g = parseInt(val.substring(2, 4), 16);
        const b = parseInt(val.substring(4, 6), 16);
        if (!isNaN(r) && !isNaN(g) && !isNaN(b)) {
            document.getElementById('r-in').value = r;
            document.getElementById('g-in').value = g;
            document.getElementById('b-in').value = b;
            updateValues(r, g, b);
        }
    }
}

function fromRGB() {
    const r = Math.min(255, Math.max(0, parseInt(document.getElementById('r-in').value) || 0));
    const g = Math.min(255, Math.max(0, parseInt(document.getElementById('g-in').value) || 0));
    const b = Math.min(255, Math.max(0, parseInt(document.getElementById('b-in').value) || 0));
    updateValues(r, g, b);
}

function copyVal(id, btn) {
    const txt = document.getElementById(id).textContent;
    navigator.clipboard.writeText(txt).then(() => {
        const orig = btn.textContent;
        btn.textContent = 'Copied!';
        setTimeout(() => btn.textContent = orig, 1500);
    });
}
</script>
