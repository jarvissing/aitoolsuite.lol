<style>
.tool-container { font-family: system-ui, -apple-system, sans-serif; background: #111827; padding: 24px; border-radius: 12px; box-sizing: border-box; max-width: 900px; margin: 0 auto; color: #f8fafc; }
.tool-grid { display: grid; grid-template-columns: 1fr; gap: 16px; margin-bottom: 16px; }
.col label { display: block; font-size: 13px; font-weight: 600; color: #94a3b8; margin-bottom: 6px; }
.col textarea { width: 100%; height: 120px; background: #0b0f19; color: #f8fafc; border: 1px solid #334155; border-radius: 8px; padding: 12px; box-sizing: border-box; font-family: monospace; font-size: 13px; resize: vertical; }
.output-code { background: #0b0f19; border: 1px solid #334155; border-radius: 8px; padding: 14px; color: #38bdf8; font-family: monospace; font-size: 13px; white-space: pre-wrap; word-break: break-all; min-height: 160px; }
.btn-row { display: flex; gap: 10px; margin-bottom: 12px; }
.btn-act { background: #3b82f6; color: #fff; border: none; padding: 10px 18px; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 600; }
.btn-copy { background: #1e293b; color: #38bdf8; border: 1px solid #334155; padding: 10px 16px; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 600; }
</style>
<div class="tool-container">
    <div class="tool-grid">
        <div class="col">
            <label>Paste cURL Command:</label>
            <textarea id="curlFetchInput" placeholder="curl -X POST https://api.example.com/data -H 'Content-Type: application/json' -d '{&quot;foo&quot;: &quot;bar&quot;}'" oninput="convertCurlToFetch()"></textarea>
        </div>
        <div class="btn-row">
            <button class="btn-act" onclick="convertCurlToFetch()">Convert to JavaScript Fetch</button>
            <button class="btn-copy" onclick="copyFetch(this)">Copy Fetch Code</button>
        </div>
        <div class="col">
            <label>Generated JavaScript (Fetch) Code:</label>
            <div id="fetchOutput" class="output-code">// JavaScript fetch code will appear here...</div>
        </div>
    </div>
</div>
<script>
function convertCurlToFetch() {
    let raw = document.getElementById('curlFetchInput').value.trim();
    if (!raw) {
        document.getElementById('fetchOutput').textContent = '// JavaScript fetch code will appear here...';
        return;
    }
    let url = 'https://api.example.com';
    let method = 'GET';
    let headers = {};
    let data = null;
    let urlMatch = raw.match(/['"]?(https?:\/\/[^\s'"]+)['"]?/);
    if (urlMatch) url = urlMatch[1];
    let methodMatch = raw.match(/-X\s+([A-Z]+)/i);
    if (methodMatch) method = methodMatch[1].toUpperCase();
    let headerMatches = raw.matchAll(/-H\s+['"]([^'"]+)['"]/g);
    for (let m of headerMatches) {
        let parts = m[1].split(':');
        if (parts.length >= 2) headers[parts[0].trim()] = parts.slice(1).join(':').trim();
    }
    let dataMatch = raw.match(/(?:-d|--data|--data-raw)\s+['"]([^'"]+)['"]/);
    if (dataMatch) {
        data = dataMatch[1];
        if (method === 'GET') method = 'POST';
    }
    let code = `fetch("${url}", {\n  method: "${method}",\n`;
    if (Object.keys(headers).length > 0) {
        code += `  headers: ${JSON.stringify(headers, null, 4).replace(/\n/g, '\n  ')},\n`;
    }
    if (data) {
        try {
            JSON.parse(data);
            code += `  body: JSON.stringify(${data})\n`;
        } catch(e) {
            code += `  body: "${data}"\n`;
        }
    }
    code += `})\n  .then(res => res.json())\n  .then(data => console.log(data))\n  .catch(err => console.error(err));`;
    document.getElementById('fetchOutput').textContent = code;
}
function copyFetch(btn) {
    let code = document.getElementById('fetchOutput').textContent;
    if (!code) return;
    navigator.clipboard.writeText(code).then(() => {
        let orig = btn.textContent;
        btn.textContent = 'Copied!';
        setTimeout(() => btn.textContent = orig, 1800);
    });
}
</script>
