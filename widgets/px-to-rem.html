<style>
.tool-container { font-family: system-ui, -apple-system, sans-serif; background: #111827; padding: 24px; border-radius: 12px; box-sizing: border-box; max-width: 800px; margin: 0 auto; color: #f8fafc; }
.tool-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
@media (max-width: 600px) { .tool-grid { grid-template-columns: 1fr; } }
.tool-input-group { display: flex; flex-direction: column; gap: 8px; }
.tool-input-group label { font-size: 13px; font-weight: 600; color: #94a3b8; }
.tool-input-group input { background: #0b0f19; color: #f8fafc; border: 1px solid #334155; border-radius: 8px; padding: 12px 16px; box-sizing: border-box; font-size: 16px; font-family: monospace; }
.tool-input-group input:focus { border-color: #3b82f6; outline: none; }
.base-setting { background: rgba(59, 130, 246, 0.1); border: 1px solid rgba(59, 130, 246, 0.3); border-radius: 8px; padding: 12px 16px; margin-bottom: 20px; display: flex; align-items: center; justify-content: space-between; font-size: 14px; }
.base-setting input { width: 80px; background: #0b0f19; color: #fff; border: 1px solid #334155; border-radius: 6px; padding: 6px 10px; font-family: monospace; text-align: center; }
.copy-btn { background: #1e293b; color: #38bdf8; border: 1px solid #334155; padding: 8px 14px; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 600; margin-top: 8px; }
.copy-btn:hover { background: #3b82f6; color: #fff; border-color: #3b82f6; }
</style>
<div class="tool-container">
    <div class="base-setting">
        <span>⚙️ Base Font Size (Root):</span>
        <div style="display:flex; align-items:center; gap:6px;">
            <input type="number" id="basePx" value="16" min="1" oninput="convertFromPx()">
            <span>px</span>
        </div>
    </div>
    <div class="tool-grid">
        <div class="tool-input-group">
            <label for="pxInput">Pixels (PX)</label>
            <input type="number" id="pxInput" value="16" placeholder="e.g. 24" oninput="convertFromPx()">
            <button class="copy-btn" onclick="copyValue('pxInput', this)">Copy PX</button>
        </div>
        <div class="tool-input-group">
            <label for="remInput">Root EM (REM)</label>
            <input type="number" id="remInput" value="1" step="0.05" placeholder="e.g. 1.5" oninput="convertFromRem()">
            <button class="copy-btn" onclick="copyValue('remInput', this)">Copy REM</button>
        </div>
    </div>
</div>
<script>
function convertFromPx() {
    let px = parseFloat(document.getElementById('pxInput').value);
    let base = parseFloat(document.getElementById('basePx').value) || 16;
    if (isNaN(px)) {
        document.getElementById('remInput').value = '';
        return;
    }
    let rem = px / base;
    document.getElementById('remInput').value = Math.round(rem * 10000) / 10000;
}
function convertFromRem() {
    let rem = parseFloat(document.getElementById('remInput').value);
    let base = parseFloat(document.getElementById('basePx').value) || 16;
    if (isNaN(rem)) {
        document.getElementById('pxInput').value = '';
        return;
    }
    let px = rem * base;
    document.getElementById('pxInput').value = Math.round(px * 100) / 100;
}
function copyValue(id, btn) {
    let val = document.getElementById(id).value;
    if (!val) return;
    let unit = id === 'pxInput' ? 'px' : 'rem';
    navigator.clipboard.writeText(val + unit).then(() => {
        let orig = btn.textContent;
        btn.textContent = 'Copied!';
        setTimeout(() => btn.textContent = orig, 1800);
    });
}
</script>
