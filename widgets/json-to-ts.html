<style>
.tool-container { font-family: system-ui, -apple-system, sans-serif; background: #111827; padding: 24px; border-radius: 12px; box-sizing: border-box; max-width: 900px; margin: 0 auto; color: #f8fafc; }
.tool-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px; }
@media (max-width: 640px) { .tool-grid { grid-template-columns: 1fr; } }
.col label { display: block; font-size: 13px; font-weight: 600; color: #94a3b8; margin-bottom: 6px; }
.col textarea { width: 100%; height: 220px; background: #0b0f19; color: #f8fafc; border: 1px solid #334155; border-radius: 8px; padding: 12px; box-sizing: border-box; font-family: monospace; font-size: 13px; resize: vertical; }
.btn-row { display: flex; gap: 10px; }
.btn-act { background: #3b82f6; color: #fff; border: none; padding: 10px 18px; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 13px; }
.btn-copy { background: #1e293b; color: #38bdf8; border: 1px solid #334155; padding: 10px 16px; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 600; }
</style>
<div class="tool-container">
    <div class="tool-grid">
        <div class="col">
            <label>JSON Object Input:</label>
            <textarea id="jsonTsInput" placeholder="{&#10;  &quot;id&quot;: 1,&#10;  &quot;title&quot;: &quot;AI Agent&quot;,&#10;  &quot;isLive&quot;: true,&#10;  &quot;tags&quot;: [&quot;ai&quot;, &quot;tools&quot;]&#10;}" oninput="generateTypeScript()"></textarea>
        </div>
        <div class="col">
            <label>TypeScript Interface Output:</label>
            <textarea id="tsOutput" readonly placeholder="TypeScript interface will generate here..."></textarea>
        </div>
    </div>
    <div class="btn-row">
        <button class="btn-act" onclick="generateTypeScript()">Generate Interface</button>
        <button class="btn-copy" onclick="copyTs(this)">Copy TypeScript</button>
    </div>
</div>
<script>
function getType(val) {
    if (val === null) return 'any';
    if (Array.isArray(val)) {
        if (val.length === 0) return 'any[]';
        return getType(val[0]) + '[]';
    }
    return typeof val;
}
function generateTypeScript() {
    let raw = document.getElementById('jsonTsInput').value.trim();
    if (!raw) {
        document.getElementById('tsOutput').value = '';
        return;
    }
    try {
        let obj = JSON.parse(raw);
        let ts = `export interface RootObject {\n`;
        for (let key of Object.keys(obj)) {
            ts += `  ${key}: ${getType(obj[key])};\n`;
        }
        ts += `}\n`;
        document.getElementById('tsOutput').value = ts;
    } catch(e) {
        document.getElementById('tsOutput').value = '// Invalid JSON input';
    }
}
function copyTs(btn) {
    let code = document.getElementById('tsOutput').value;
    if (!code) return;
    navigator.clipboard.writeText(code).then(() => {
        let orig = btn.textContent;
        btn.textContent = 'Copied!';
        setTimeout(() => btn.textContent = orig, 1800);
    });
}
</script>
